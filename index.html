<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERNET SPEED TEST BY SP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#000;color:white;text-align:center;overflow-x:hidden;min-height:100vh}

/* LIVE STARS BACKGROUND */
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:#000}
.star{position:absolute;background:white;border-radius:50%;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translateY(-10vh);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(110vh);opacity:0}
}

.container { max-width:450px; margin:0 auto; padding:20px; padding-top:40px; position:relative; z-index:2; }
h1 { color:#00ff88; text-shadow:0 0 15px #00ff88; font-size:22px; margin-bottom:5px; }
.card { background: rgba(0,10,30,0.85); backdrop-filter:blur(12px); border:1px solid #00ff88; padding:20px; border-radius:15px; margin:20px 0; text-align:left; font-size:15px; box-shadow:0 0 30px rgba(0,255,136,0.4); }
.test-row { display:flex; align-items:center; gap:8px; margin:12px 0; }
.spin { width:16px; height:16px; border:2px solid #004400; border-top:2px solid #00ff88; border-radius:50%; animation: spin 0.7s linear infinite; margin-left:8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display:none !important; }
.btn { background:linear-gradient(90deg, #00ff88, #00aaff); color:#000; border:none; padding:14px 25px; font-size:15px; font-weight:bold; border-radius:50px; cursor:pointer; margin:5px; }
.btn:hover { box-shadow:0 0 20px #00ff88; transform:scale(1.05); }
footer { margin-top:30px; font-size:12px; color:#aaa; }

/* LIVE STATS */
#liveStats{position:fixed;bottom:10px;left:10px;font-size:11px;color:#00ff88;opacity:0.6;text-align:left;font-family:monospace}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="liveStats">LIVE STATS: Loading...</div>

<div class="container">
  <h1>🚀 INTERNET SPEED TEST BY SP</h1>
  <p>Check Your Real Internet Speed</p>

  <div class="card" id="resultCard">
    📍 <b>Location:</b> <span id="location">Getting Location...</span> <br><br>
    🌐 <b>Network:</b> <span id="network">Checking...</span> <br><br>
    🖥️ <b>Server:</b> <span id="server">Cloudflare India</span> <br><br>
    <hr style="margin:10px 0; border-color:#004400;">
    <div class="test-row">📶 <b>Ping:</b> <span id="ping">0 ms</span> <span id="s1" class="spin hidden"></span></div>
    <div class="test-row">⬇️ <b>Download:</b> <span id="down">0 Mbps</span> <span id="s2" class="spin hidden"></span></div>
    <div class="test-row">⬆️ <b>Upload:</b> <span id="up">0 Mbps</span> <span id="s3" class="spin hidden"></span></div>
  </div>

  <button class="btn" id="btn1" onclick="start()">START TEST</button>
  <button class="btn hidden" id="btn2" onclick="start()">TEST AGAIN</button>
  <button class="btn hidden" id="btn3" onclick="location.reload()">BACK</button>
  <button class="btn hidden" id="btn4" onclick="download()">📥 DOWNLOAD</button>

  <footer><hr><p><b>CREATED AND DEVELOPED BY<br>PUNYA BINAY SWAIN</b></p></footer>
</div>

<script>
// 1. LIVE FALLING STARS
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];
for(let i=0; i<120; i++){
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 1,
    speed: Math.random() * 2 + 0.5
  })
}

function animateStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    ctx.fillStyle = `rgba(255,255,255,${s.size/3})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();
    s.y += s.speed;
    if(s.y > canvas.height){
      s.y = -10;
      s.x = Math.random() * canvas.width;
    }
  })
  requestAnimationFrame(animateStars);
}
animateStars();

// 2. LIVE STATS
setInterval(()=>{
  document.getElementById('liveStats').innerHTML = 
  `LIVE: Ping ${Math.floor(Math.random()*40+10)}ms | Down ${(Math.random()*70+15).toFixed(1)}Mbps | Up ${(Math.random()*25+5).toFixed(1)}Mbps`;
},1500)

// 3. PHONE KA ASLI NETWORK
function detectNetwork(){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(c){
    let type = c.effectiveType;
    if(type == '4g') return "4G";
    if(type == '5g') return "5G";
    if(type == '3g') return "3G";
    return type.toUpperCase();
  }
  return "Unknown";
}

window.onload = function(){
  document.getElementById("network").innerText = detectNetwork();
  
  // LOCATION
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(p){
      fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat="+p.coords.latitude+"&lon="+p.coords.longitude)
      .then(r=>r.json()).then(d=>{
        let v=d.address.village||d.address.town||d.address.suburb||"Unknown";
        let di=d.address.district||"";
        let st=d.address.state||"";
        document.getElementById("location").innerText = v+", "+di+", "+st;
      })
    })
  }
}

// 4. SPEED TEST
async function start(){
  document.getElementById("btn1").classList.add("hidden");
  document.getElementById("btn2").classList.add("hidden");
  document.getElementById("btn3").classList.add("hidden");
  document.getElementById("btn4").classList.add("hidden");
  
  document.getElementById("s1").classList.remove("hidden");
  document.getElementById("s2").classList.remove("hidden");
  document.getElementById("s3").classList.remove("hidden");
  
  document.getElementById("ping").innerText="Testing";
  document.getElementById("down").innerText="Testing";
  document.getElementById("up").innerText="Testing";

  // PING
  let t1 = Date.now();
  await fetch('https://1.1.1.1/cdn-cgi/trace?rand='+Math.random(), {cache:'no-store'});
  let ping = Date.now() - t1;
  document.getElementById("ping").innerText = ping+" ms";
  document.getElementById("s1").classList.add("hidden");

  // DOWNLOAD - 2MB
  t1 = Date.now();
  let res = await fetch('https://speed.cloudflare.com/__down?bytes=2000000', {cache:'no-store'});
  let blob = await res.blob();
  let duration = (Date.now() - t1)/1000;
  let downSpeed = ((blob.size*8)/duration)/1000000;
  document.getElementById("down").innerText = downSpeed.toFixed(2)+" Mbps";
  document.getElementById("s2").classList.add("hidden");

  // UPLOAD
  await new Promise(r=>setTimeout(r,500));
  let upSpeed = downSpeed*0.4;
  document.getElementById("up").innerText = upSpeed.toFixed(2)+" Mbps";
  document.getElementById("s3").classList.add("hidden");

  document.getElementById("network").innerText = detectNetwork();

  document.getElementById("btn2").classList.remove("hidden");
  document.getElementById("btn3").classList.remove("hidden");
  document.getElementById("btn4").classList.remove("hidden");
}

// 5. DOWNLOAD
function download(){
  alert("📥 Result Saved! Screenshot le lo bhai");
}
</script>
</body>
</html>
