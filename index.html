<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genuine Internet Speed Test By SP</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif}
body{background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.container{width:100%;max-width:420px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:25px}
.header{text-align:center;margin-bottom:20px}
.header h1{font-size:20px;font-weight:900;color:#333}
.header p{font-size:11px;color:#777}

/* TRAI EXACT GAUGE */
.gauge{position:relative;width:280px;height:160px;margin:0 auto 20px}
.gauge svg{width:100%;height:100%}
.gauge-bg{fill:none;stroke:#E0E0E0;stroke-width:20;stroke-linecap:round}
.gauge-progress{fill:none;stroke:url(#grad);stroke-width:20;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset .15s linear}
.needle{stroke:#FF3B30;stroke-width:5;stroke-linecap:round;transform-origin:140px 140px;transition:transform .15s ease-out}
.center-dot{fill:#FF3B30}
.readout{position:absolute;top:55%;left:50%;transform:translate(-50%,-50%);text-align:center}
.readout .val{font-size:42px;font-weight:900;color:#333}
.readout .unit{font-size:12px;color:#777;font-weight:700}

.status{text-align:center;color:#FF6B00;font-weight:700;font-size:14px;margin-bottom:15px;min-height:20px}

.stats{display:flex;gap:10px;margin-bottom:20px}
.stat{flex:1;background:#F8F8F8;border:1px solid #E0E0E0;border-radius:10px;padding:15px;text-align:center}
.stat .v{font-size:20px;font-weight:900;color:#333}
.stat .l{font-size:11px;color:#777;margin-top:3px}

.btn{width:100%;background:linear-gradient(90deg, #FF6B00 0%, #003366 100%);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:900;font-size:16px;cursor:pointer;letter-spacing:0.5px}
.btn:disabled{opacity:.5}

.info{background:#F8F8F8;border-radius:10px;padding:15px;margin-top:20px}
.info h3{font-size:12px;color:#FF6B00;font-weight:900;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid #E0E0E0}
.row:last-child{border:0}
.row span:first-child{color:#555}
.row span:last-child{color:#333;font-weight:700}

.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}
.popup-box{background:#fff;border-radius:12px;width:90%;max-width:400px;padding:20px}
.popup-box h2{text-align:center;color:#FF6B00;margin-bottom:15px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>GENUINE INTERNET SPEED TEST</h1>
    <p>BY SP | BY PUNYA BINAY SWAIN</p>
  </div>

  <div class="gauge">
    <svg viewBox="0 0 280 160">
      <defs><linearGradient id="grad"><stop offset="0%" stop-color="#00C853"/><stop offset="50%" stop-color="#FF6B00"/><stop offset="100%" stop-color="#D50000"/></linearGradient></defs>
      <path class="gauge-bg" d="M 30 140 A 110 110 0 0 1 250 140"/>
      <path class="gauge-progress" id="progress" d="M 30 140 A 110 110 0 0 1 250 140"/>
      <line id="needle" x1="140" y1="140" x2="140" y2="40" class="needle"/>
      <circle cx="140" cy="140" r="6" class="center-dot"/>
    </svg>
    <div class="readout">
      <div class="val" id="speed">0</div>
      <div class="unit">Mbps</div>
    </div>
  </div>

  <div class="status" id="status">Tap RUN TEST to start</div>

  <div class="stats">
    <div class="stat"><div class="v" id="download">0.00</div><div class="l">Mbps Download</div></div>
    <div class="stat"><div class="v" id="upload">0.00</div><div class="l">Mbps Upload</div></div>
  </div>

  <button class="btn" id="startBtn">RUN TEST</button>

  <div class="info">
    <h3>DEVICE INFORMATION</h3>
    <div class="row"><span>Device</span><span id="device">-</span></div>
    <div class="row"><span>Exact Location</span><span id="location">Allow GPS</span></div>
    <div class="row"><span>IP Address</span><span id="ip">-</span></div>
    <div class="row"><span>ISP</span><span id="isp">-</span></div>
    <div class="row"><span>Network</span><span id="network">-</span></div>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h2>✅ Test Complete</h2>
    <div id="popupData"></div>
    <button class="btn" style="margin-top:15px" onclick="popup.style.display='none'">Close</button>
  </div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
let running = false;

startBtn.addEventListener('click', startTest); // FIXED BUTTON

function updateGauge(val, max=1000){
  let p = Math.min(val/max, 1);
  document.getElementById('progress').style.strokeDashoffset = 440 - (440*p);
  document.getElementById('needle').style.transform = `rotate(${(p*180)-90}deg)`;
  document.getElementById('speed').innerText = val.toFixed(2);
}

async function startTest(){
  if(running) return; running = true; startBtn.disabled = true;
  document.getElementById('download').innerText='0.00';
  document.getElementById('upload').innerText='0.00';
  updateGauge(0);

  await loadInfo();
  await loadLocation();
  await testPing();
  let down = await testSpeed('download');
  updateGauge(0,200);
  let up = await testSpeed('upload');

  document.getElementById('status').innerText='Test Complete';
  showPopup(down, up);
  running=false; startBtn.disabled=false;
}

async function testSpeed(type){
  status.innerText = 'Testing ' + type + '...';
  let bytes=0, start=performance.now(), duration=20000;
  let iv = setInterval(()=>{
    let t=(performance.now()-start)/1000;
    if(t>1){let s=(bytes*8)/1000000/t;document.getElementById(type).innerText=s.toFixed(2);updateGauge(s,type==='download'?1000:200)}
  },100);

  let workers = Array(6).fill().map(async()=>{
    while(performance.now()-start<duration){
      try{
        let url = `https://speed.cloudflare.com/__${type==='download'?'down?bytes=100000':'up'}&t=${Date.now()}`;
        let res = await fetch(url,{method:type==='download'?'GET':'POST',body:type==='upload'?new Blob([new Uint8Array(5*1024*1024)]):null});
        if(type==='download'){let r=res.body.getReader();while(true){let {done,value}=await r.read();if(done)break;bytes+=value.length}}else bytes+=5*1024*1024;
      }catch(e){}
    }
  });
  await Promise.all(workers); clearInterval(iv);
  return ((bytes*8)/1000000/((performance.now()-start)/1000)).toFixed(2);
}

async function testPing(){
  status.innerText='Testing Ping...';
  let s=performance.now(); await fetch('https://www.google.com/favicon.ico?t='+Date.now(),{mode:'no-cors'});
  document.getElementById('ping')?0:0;
}

async function loadLocation(){ // EXACT VILLAGE + PINCODE
  return new Promise(res=>{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(async p=>{
        try{
          let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}&zoom=18`);
          let d=await r.json();
          location.innerText=`${d.address.village||d.address.suburb||d.address.town}, ${d.address.state} - ${d.address.postcode}`;
        }catch(e){location.innerText='Error'} res();
      },()=>{location.innerText='Permission Denied';res()},{enableHighAccuracy:true})
    }else res();
  })
}

async function loadInfo(){
  device.innerText=navigator.userAgent.includes('Android')?'Android Mobile':'Desktop';
  let c=navigator.connection; 
  network.innerText=c?c.downlink>50?'5G':c.downlink>15?'4G':'WiFi':'WiFi';
  try{let r=await fetch('https://ipapi.co/json/');let d=await r.json();ip.innerText=d.ip;isp.innerText=d.org}catch(e){}
}

function showPopup(down,up){
  popupData.innerHTML=`
  <div class="row"><span>Download</span><span>${down} Mbps</span></div>
  <div class="row"><span>Upload</span><span>${up} Mbps</span></div>
  <div class="row"><span>Location</span><span>${location.innerText}</span></div>
  <div class="row"><span>IP</span><span>${ip.innerText}</span></div>`;
  popup.style.display='flex';
}
</script>
</body>
</html>
