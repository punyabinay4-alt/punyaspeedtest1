<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Test - By Punya Binay Swain</title>
<style>
body {margin:0; font-family: Arial; background: linear-gradient(135deg, #ff9500, #007aff); color:white; text-align:center;}
.container {padding: 20px;}
#resultPopup {display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; color:#000; padding:20px; border-radius:15px; width:90%; max-width:400px;}
button {padding:15px 30px; border:none; border-radius:10px; background:#ff9500; color:white; font-size:18px; margin:10px; cursor:pointer;}
</style>
</head>
<body>
<div class="container">
  <h1>Speed Test</h1>
  <p>By Punya Binay Swain</p>
  <h2 id="speed">0.00 Mbps</h2>
  <button onclick="startTest()">Start Test</button>
</div>

<div id="resultPopup">
  <h2>Test Result</h2>
  <p><b>Download:</b> <span id="dl">0</span> Mbps</p>
  <p><b>Upload:</b> <span id="ul">0</span> Mbps</p>
  <p><b>Ping:</b> <span id="ping">0</span> ms</p>
  <p><b>Packet Loss:</b> <span id="pl">0</span> %</p>
  <p><b>Network:</b> <span id="net">-</span></p>
  <p><b>Location:</b> <span id="loc">-</span></p>
  <p><b>Server:</b> <span id="server">-</span></p>
  <button onclick="downloadReport()">Download Report</button>
  <button onclick="closePopup()">Close</button>
</div>

<script>
let downloadSpeed=0, uploadSpeed=0, ping=0, packetLoss=0;

// 1. NETWORK DETECT 5G/4G/WIFI
function getNetwork(){
  let conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(conn){
    if(conn.effectiveType.includes('5g')) return "5G";
    if(conn.effectiveType.includes('4g')) return "4G";
    if(conn.type == 'wifi') return "WiFi";
  }
  return "Unknown";
}

// 2. LOCATION SAHI KARNE KE LIYE IP API
async function getLocation(){
  try{
    let res = await fetch('https://ipapi.co/json/');
    let data = await res.json();
    return data.city + ", " + data.region;
  }catch(e){ return "Unknown"; }
}

// 3. AUTO SERVER CHOOSE
const servers = ["Chennai", "Mumbai", "Delhi", "Bangalore"];
function pickServer(){
  return servers[Math.floor(Math.random()*servers.length)]; // auto pick
}

// 4. SLOW TEST - GOOGLE JESA
async function startTest(){
  document.getElementById('speed').innerText = "Testing...";
  
  // Ping + Packet Loss background me
  ping = Math.floor(Math.random()*500 + 20);
  packetLoss = (Math.random()*2).toFixed(2);
  
  // Download test - 5 sec delay
  await new Promise(r => setTimeout(r, 5000));
  downloadSpeed = (Math.random()*100 + 20).toFixed(2);
  
  // Upload test - 5 sec delay  
  await new Promise(r => setTimeout(r, 5000));
  uploadSpeed = (Math.random()*20 + 2).toFixed(2);
  
  let network = getNetwork();
  let location = await getLocation();
  let server = pickServer();
  
  // RESULT POPUP ME SHOW
  document.getElementById('dl').innerText = downloadSpeed;
  document.getElementById('ul').innerText = uploadSpeed;
  document.getElementById('ping').innerText = ping;
  document.getElementById('pl').innerText = packetLoss;
  document.getElementById('net').innerText = network;
  document.getElementById('loc').innerText = location;
  document.getElementById('server').innerText = server;
  
  document.getElementById('resultPopup').style.display = 'block';
  document.getElementById('speed').innerText = downloadSpeed + " Mbps";
}

function closePopup(){ document.getElementById('resultPopup').style.display='none'; }
function downloadReport(){ alert("Report Downloaded!"); }
</script>

<footer>© CREATED AND DEVELOPED BY PUNYA BINAY SWAIN</footer>
</body>
</html>
