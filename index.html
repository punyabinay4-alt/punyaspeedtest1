<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genuine Internet Speed Test Platform By SP</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif}
body{background:#0B0F1A;display:flex;flex-direction:column;align-items:center;color:#fff}
.header{width:100%;background:#111827;padding:20px;text-align:center;border-bottom:3px solid #F97316}
.header h1{font-size:24px;font-weight:900;color:#F97316}
.wrap{width:95%;max-width:500px;background:#111827;margin:30px 0;border-radius:16px;padding:25px}
.gauge{width:100%;height:220px;position:relative}
.gauge svg{width:100%;height:100%}
.track{fill:none;stroke:#1F2937;stroke-width:30;stroke-linecap:round}
.bar{fill:none;stroke:#F97316;stroke-width:30;stroke-linecap:round;stroke-dasharray:628;stroke-dashoffset:628;transition:stroke-dashoffset .05s linear}
.needle{stroke:#fff;stroke-width:5;transform-origin:250px 250px;transition:transform .05s linear}
.read{position:absolute;top:65%;left:50%;transform:translate(-50%,-50%);text-align:center}
.read .n{font-size:56px;font-weight:900}
.status{text-align:center;color:#F97316;font-weight:800;margin:15px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#1F2937;border-radius:12px;padding:18px;text-align:center}
.stat .v{font-size:28px;font-weight:900}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;background:#F97316;color:#000;border:none;padding:15px;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer}
.btn.sec{background:#374151;color:#fff}
.info{margin-top:20px;background:#1F2937;border-radius:12px;padding:18px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #374151;font-size:14px}
.footer{width:100%;background:#111827;text-align:center;padding:20px;margin-top:auto;border-top:3px solid #F97316}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center}
.pbox{background:#111827;border-radius:16px;width:90%;max-width:480px;padding:20px;border:1px solid #374151}
</style>
</head>
<body>
<div class="header"><h1>GENUINE INTERNET SPEED TEST PLATFORM BY SP</h1></div>
<div class="wrap">
  <div class="gauge">
    <svg viewBox="0 0 500 300"><path class="track" d="M 50 250 A 200 200 0 0 1 450 250"/><path class="bar" id="bar"/><line id="needle" x1="250" y1="250" x2="250" y2="60"/><circle cx="250" cy="250" r="10"/></svg>
    <div class="read"><div class="n" id="speed">0.00</div><div>Mbps</div></div>
  </div>
  <div class="status" id="status">READY</div>
  <div class="stats">
    <div class="stat"><div class="v" id="down">0.00</div><div>DOWNLOAD</div></div>
    <div class="stat"><div class="v" id="up">0.00</div><div>UPLOAD</div></div>
  </div>
  <div class="btns"><button class="btn" id="start">START TEST</button><button class="btn sec" onclick="location.reload()">RESET</button></div>
  <div class="info">
    <div class="row"><span>Device</span><span id="device">-</span></div>
    <div class="row"><span>Location</span><span id="loc">Allow Permission</span></div>
    <div class="row"><span>IP</span><span id="ip">-</span></div>
    <div class="row"><span>ISP</span><span id="isp">-</span></div>
    <div class="row"><span>Network</span><span id="net">-</span></div>
  </div>
</div>
<div class="footer">COPYRIGHT © 2026 RESERVED<br><b>CREATED AND DEVELOPED BY PUNYA BINAY SWAIN</b></div>
<div class="popup" id="popup"><div class="pbox"><h2 style="color:#F97316;text-align:center">TEST RESULT</h2><div id="pdata"></div><button class="btn" style="width:100%;margin-top:15px" onclick="popup.style.display='none'">CLOSE</button></div></div>
<script>
let run=false;
start.onclick=runTest;

function gauge(v,max=1000){let p=Math.min(v/max,1);bar.style.strokeDashoffset=628-(628*p);needle.style.transform=`rotate(${(p*180)-90}deg)`;speed.innerText=v.toFixed(2)}

async function runTest(){
  if(run)return; run=true; start.disabled=true;
  down.innerText=up.innerText='0.00'; gauge(0); // FIX: RESET TO 0
  status.innerText='Loading...';
  
  await info(); await locat();
  let d=await test('dl'); gauge(0,200); // FIX: RESET BEFORE UPLOAD
  let u=await test('ul');
  
  status.innerText='DONE'; show(d,u); run=false; start.disabled=false;
}

async function test(t){
  status.innerText='Testing '+t+'...';
  let b=0,s=performance.now(),time=20000;
  let iv=setInterval(()=>{let tt=(performance.now()-s)/1000;if(tt>1){let sp=(b*8)/1000000/tt;document.getElementById(t==='dl'?'down':'up').innerText=sp.toFixed(2);gauge(sp,t==='dl'?500:100)}},100);
  let arr=Array(16).fill().map(async()=>{while(performance.now()-s<time){try{ // 16 threads
    if(t==='dl'){let r=await fetch('https://speed.cloudflare.com/__down?bytes=200000&r='+Math.random());let rd=r.body.getReader();while(true){let {done,val}=await rd.read();if(done)break;b+=val.length}}
    else{await fetch('https://httpbin.org/post',{method:'POST',body:new Blob([new Uint8Array(1024*1024)])});b+=1024*1024} // httpbin for upload
  }catch(e){}}});
  await Promise.all(arr); clearInterval(iv);
  return ((b*8)/1000000/((performance.now()-s)/1000)).toFixed(2);
}

async function locat(){
  if(!navigator.geolocation){loc.innerText='Denied';return}
  navigator.geolocation.getCurrentPosition(async p=>{
    try{let r=await fetch(`https://geolocation-db.com/json/`);let d=await r.json();loc.innerText=`${d.city}, ${d.state} - ${d.postal}`}catch(e){}
  },{enableHighAccuracy:true});
}

async function info(){
  device.innerText=/Mobile/.test(navigator.userAgent)?'Mobile':'Desktop';
  try{let r=await fetch('https://api.ipify.org?format=json');let d=await r.json();ip.innerText=d.ip;let r2=await fetch('https://ipapi.co/'+d.ip+'/json/');let d2=await r2.json();isp.innerText=d2.org}catch(e){}
  let c=navigator.connection; net.innerText=c?c.type==='wifi'?'WiFi':'Mobile':(navigator.onLine?'Broadband':'Offline');
}

function show(d,u){
  pdata.innerHTML=`<div class="row"><span>Download</span><b>${d} Mbps</b></div><div class="row"><span>Upload</span><b>${u} Mbps</b></div><div class="row"><span>Location</span><b>${loc.innerText}</b></div>`;
  popup.style.display='flex';
}
</script></body></html>
