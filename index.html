<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedTestX Pro by SP</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body {
    background: url('https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?q=80&w=1920') no-repeat center fixed;
    background-size: cover;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  body::before {
    content: '';
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(5, 15, 40, 0.85);
    z-index: -1;
  }
  h1 { color: #00FFC6; font-size: 28px; text-shadow: 0 0 10px #00FFC6; margin-bottom: 5px; }
  h1 span { color: #FFA500; }
  .subtitle { color: #aaa; margin-bottom: 20px; }

  .card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 20px;
    margin: 20px auto;
    max-width: 600px;
    backdrop-filter: blur(15px);
  }

  /* GAUGE */
  .gauge {
    width: 280px; height: 140px;
    border: 18px solid rgba(255,255,255,0.2);
    border-bottom: none;
    border-radius: 280px 280px 0 0;
    margin: 20px auto;
    position: relative;
  }
  .gauge-fill {
    width: 280px; height: 140px;
    border: 18px solid #00FFC6;
    border-bottom: none;
    border-radius: 280px 280px 0 0;
    position: absolute;
    top: -18px; left: -18px;
    transform-origin: center bottom;
    transform: rotate(-90deg);
    transition: transform 1.2s ease-out;
  }
  .gauge-value {
    position: absolute;
    width: 100%;
    top: 60px;
    font-size: 36px;
    font-weight: bold;
    color: #fff;
  }
  .gauge-unit { font-size: 14px; color: #aaa; }

  /* CIRCLE RESULTS */
  .results {
    display: flex;
    justify-content: space-around;
    margin: 20px 0;
    flex-wrap: wrap;
    gap: 15px;
  }
  .circle-result {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(255, 165, 0, 0.5);
  }
  .circle-result .val { font-size: 22px; }
  .circle-result .label { font-size: 12px; margin-top: 4px; }

  /* BUTTONS */
  button {
    background: linear-gradient(90deg, #8A2BE2, #00FFC6);
    border: none;
    padding: 15px 30px;
    border-radius: 12px;
    color: #000;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
    width: 90%;
    transition: 0.3s;
  }
  button:hover { transform: scale(1.03); }

  /* DEVICE INFO */
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
  }
  .info-row span:last-child { font-weight: bold; }
  
  .tiranga { height: 4px; background: linear-gradient(90deg, #FF9933 33%, #fff 33%, #fff 66%, #138808 66%); margin-top: 20px; }
</style>
</head>
<body>

<h1>⚡ SPEEDTEST <span>X PRO</span></h1>
<p class="subtitle">BY SP</p>

<div class="card">
  <h3 style="color:#00FFC6; margin-bottom:10px;">SPEED TEST</h3>
  
  <!-- GAUGE -->
  <div class="gauge">
    <div class="gauge-fill" id="gaugeFill"></div>
    <div class="gauge-value">
      <div id="gaugeValue">0.00</div>
      <div class="gauge-unit" id="gaugeUnit">Mbps</div>
    </div>
  </div>

  <!-- CIRCLE RESULTS -->
  <div class="results">
    <div class="circle-result">
      <div class="val" id="ping">0</div>
      <div class="label">ms Latency</div>
    </div>
    <div class="circle-result">
      <div class="val" id="download">0</div>
      <div class="label">Mbps Download</div>
    </div>
    <div class="circle-result">
      <div class="val" id="upload">0</div>
      <div class="label">Mbps Upload</div>
    </div>
  </div>

  <button onclick="startTest()">START TEST</button>
  <button onclick="startTest()">TEST AGAIN</button>
</div>

<div class="card">
  <button onclick="getLocation()">📍 GET PRECISE DEVICE LOCATION</button>
  <h3 style="color:#00FFC6; margin: 15px 0;">DEVICE INFORMATION</h3>
  <div class="info-row"><span>📱 DEVICE NAME</span><span id="device">Loading...</span></div>
  <div class="info-row"><span>📍 LOCATION</span><span id="location">-</span></div>
  <div class="info-row"><span>🏷️ IP ADDRESS</span><span id="ip">-</span></div>
  <div class="info-row"><span>📡 NETWORK SOURCE</span><span id="isp">-</span></div>
  <div class="info-row"><span>📶 NETWORK TYPE</span><span id="network">-</span></div>
</div>

<div class="tiranga"></div>

<script>
// FAKE TEST - Isko LibreSpeed API se connect karna padega accuracy ke liye
function startTest() {
  let gauge = document.getElementById('gaugeFill');
  let val = document.getElementById('gaugeValue');
  let unit = document.getElementById('gaugeUnit');
  let pingEl = document.getElementById('ping');
  let downEl = document.getElementById('download');
  let upEl = document.getElementById('upload');

  // Reset
  gauge.style.transform = 'rotate(-90deg)';
  val.innerText = '0.00';
  
  // Step 1: Ping Test
  unit.innerText = 'ms';
  let ping = Math.floor(Math.random() * 80 + 20);
  animateGauge(ping, 200, ping);
  pingEl.innerText = ping;
  
  setTimeout(() => {
    // Step 2: Download Test
    unit.innerText = 'Mbps';
    let down = (Math.random() * 80 + 10).toFixed(2);
    animateGauge(down, 1000, down);
    downEl.innerText = down;

    setTimeout(() => {
      // Step 3: Upload Test
      let up = (Math.random() * 20 + 2).toFixed(2);
      animateGauge(up, 1000, up);
      upEl.innerText = up;
    }, 3000);
  }, 2000);
}

function animateGauge(value, max, displayVal) {
  let gauge = document.getElementById('gaugeFill');
  let val = document.getElementById('gaugeValue');
  let deg = (value / max) * 180 - 90; // -90 to 90 deg
  gauge.style.transform = `rotate(${deg}deg)`;
  
  let i = 0;
  let interval = setInterval(() => {
    i += value/20;
    if(i >= value) { i = value; clearInterval(interval); }
    val.innerText = parseFloat(i).toFixed(2);
  }, 50);
}

// Device Info
document.getElementById('device').innerText = navigator.userAgent;
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>document.getElementById('ip').innerText=d.ip);
navigator.connection && (document.getElementById('network').innerText = navigator.connection.effectiveType.toUpperCase());

function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('location').innerText = pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4);
  });
}
</script>

</body>
</html>
