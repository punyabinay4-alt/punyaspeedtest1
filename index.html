<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERNET SPEED TEST BY SP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Earth Globe Background -->
<div class="earth-container">
  <div class="earth"></div>
</div>

<div class="container">
  <h1>🚀 INTERNET SPEED TEST BY SP</h1>
  <p>Check Your Real Internet Speed</p>

  <!-- Spinner Clock -->
  <div id="spinner" class="hidden">
    <div class="clock"></div>
    <p>Testing...</p>
  </div>

  <div class="card" id="resultCard">
    📍 <b>Location:</b> <span id="location">Getting location...</span> <br><br>
    🌐 <b>Network:</b> <span id="network">Detecting...</span> <br><br>
    📶 <b>Ping:</b> <span id="ping">0 ms</span> <br><br>
    ⬇️ <b>Download:</b> <span id="download">0 Mbps</span> <br><br>
    ⬆️ <b>Upload:</b> <span id="upload">0 Mbps</span>
  </div>

  <div class="btn-group">
    <button id="startBtn" onclick="startTest()">START TEST</button>
    <button id="againBtn" class="hidden" onclick="startTest()">TEST AGAIN</button>
    <button id="backBtn" class="hidden" onclick="goBack()">BACK</button>
  </div>

  <footer>
    <hr>
    <p><b>CREATED AND DEVELOPED BY<br>PUNYA BINAY SWAIN</b></p>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
