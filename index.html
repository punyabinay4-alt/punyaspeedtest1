<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERNET SPEED TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; padding: 20px; color: #fff; }
.back-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
.container { max-width: 700px; margin: 0 auto; text-align: center; }
.logo { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
.logo span { color: #ff6b00; }
.subtitle { font-size: 18px; font-weight: 600; margin-bottom: 30px; }
.results-row { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
.card { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; width: 200px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
.circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #ff6b00, #ffa500); margin: 0 auto 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.circle .val { font-size: 28px; font-weight: 700; color: #000; }
.circle .unit { font-size: 12px; color: #000; }
.card .label { font-size: 15px; font-weight: 600; }
.btn-row { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.btn { padding: 14px 30px; border-radius: 50px; border: 2px solid #fff; background: transparent; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; }
.btn-primary { background: #fff; color: #203a43; }
.btn:hover { transform: translateY(-3px); }
.status { font-size: 16px; font-weight: 600; color: #ffa500; margin: 20px 0; }

/* POPUP */
.popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
.popup-content { background: #fff; color: #000; border-radius: 20px; padding: 30px; max-width: 500px; width: 100%; text-align: center; }
.popup h2 { color: #ff6b00; margin-bottom: 15px; }
.popup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; text-align: left; }
.popup-row { padding: 10px; background: #f5f5f5; border-radius: 8px; }
.popup-row b { color: #203a43; }
.thankyou { font-weight: 700; color: #ff6b00; margin: 15px 0; }
.popup-btns { display: flex; gap: 10px; margin-top: 20px; }
.popup-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
.btn-download { background: #25D366; color: #fff; }
.btn-share { background: #0088cc; color: #fff; }
.btn-close { background: #ccc; color: #000; }
</style>
</head>
<body>

<button class="back-btn" onclick="window.history.back()">⬅ BACK</button>

<div class="container">
  <div class="logo"><span>My</span>Speed</div>
  <div class="subtitle">Speed Test Results</div>

  <div class="results-row">
    <div class="card">
      <div class="circle"><div class="val" id="latency">0</div><div class="unit">ms</div></div>
      <div class="label">↔ Latency</div>
    </div>
    <div class="card">
      <div class="circle"><div class="val" id="download">0</div><div class="unit">Mbps</div></div>
      <div class="label">⬇ Download</div>
    </div>
    <div class="card">
      <div class="circle"><div class="val" id="upload">0</div><div class="unit">Mbps</div></div>
      <div class="label">⬆ Upload</div>
    </div>
  </div>

  <div class="status" id="status">Ready to Test</div>

  <div class="btn-row">
    <button class="btn btn-primary" id="runBtn" onclick="startTest()">RUN TEST</button>
    <button class="btn" onclick="location.reload()">REFRESH</button>
    <button class="btn" onclick="startTest()">TEST AGAIN</button>
  </div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content" id="popupContent">
    <h2>YOUR TEST RESULT IS HERE</h2>
    <div id="popupDate"></div>
    <div class="popup-grid" id="popupDetails"></div>
    <div class="thankyou">THANK YOU<br>JAY JAGANNATH - PUNYA BINAY SWAIN</div>
    <div class="popup-btns">
      <button class="popup-btn btn-download" onclick="downloadResult()">DOWNLOAD JPG</button>
      <button class="popup-btn btn-share" onclick="shareResult()">SHARE</button>
      <button class="popup-btn btn-close" onclick="closePopup()">BACK</button>
    </div>
  </div>
</div>

<script>
let result = {};

// START TEST
async function startTest() {
  document.getElementById('runBtn').disabled = true;
  document.getElementById('status').innerText = 'Testing... Please wait 15-20 sec';
  reset();
  
  await testPing(); // Background me jitter + packet loss bhi
  await testDownload();
  await testUpload();
  
  document.getElementById('status').innerText = 'Test Complete ✅';
  showPopup();
  document.getElementById('runBtn').disabled = false;
}

function reset() {
  ['latency','download','upload'].forEach(id => document.getElementById(id).innerText = '0');
}

// PING + JITTER + PACKET LOSS BACKGROUND
async function testPing() {
  let pings = [];
  let lost = 0;
  for(let i=0; i<20; i++) {
    let s = performance.now();
    try {
      await fetch("https://www.google.com/favicon.ico?"+Date.now(), {mode:'no-cors', cache:'no-store'});
      pings.push(performance.now() - s);
    } catch(e) { lost++; }
    await new Promise(r => setTimeout(r, 100));
  }
  result.latency = Math.round(pings.reduce((a,b)=>a+b,0)/pings.length) || 0;
  result.jitter = Math.round(Math.max(...pings) - Math.min(...pings)) || 0;
  result.packetLoss = ((lost/20)*100).toFixed(1);
  document.getElementById('latency').innerText = result.latency;
}

// DOWNLOAD - 15 SEC
async function testDownload() {
  let startTime = performance.now();
  let duration = 15000;
  let totalBytes = 0;
  let urls = [
    'https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js',
    'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'
  ];
  while(performance.now() - startTime < duration) {
    for(let url of urls) {
      try {
        let res = await fetch(url + '?r=' + Math.random(), {cache:'no-store'});
        let blob = await res.blob();
        totalBytes += blob.size;
      } catch(e){}
    }
    let elapsed = (performance.now() - startTime) / 1000;
    let speed = (totalBytes * 8) / 1000000 / elapsed;
    result.download = speed.toFixed(2);
    document.getElementById('download').innerText = result.download;
  }
}

// UPLOAD - 15 SEC
async function testUpload() {
  let startTime = performance.now();
  let duration = 15000;
  let totalBytes = 0;
  let data = new Blob([new Uint8Array(2 * 1024 * 1024)]);
  while(performance.now() - startTime < duration) {
    try {
      await fetch('https://httpbin.org/post', { method:'POST', body:data, mode:'cors' });
      totalBytes += data.size;
    } catch(e){}
    let elapsed = (performance.now() - startTime) / 1000;
    let speed = (totalBytes * 8) / 1000000 / elapsed;
    result.upload = speed.toFixed(2);
    document.getElementById('upload').innerText = result.upload;
  }
}

// POPUP SHOW
async function showPopup() {
  // Device info
  let ip = 'Loading...', isp = 'Loading...', location = 'Loading...';
  try {
    let res = await fetch('https://ipapi.co/json/');
    let data = await res.json();
    ip = data.ip; isp = data.org; location = `${data.city}, ${data.region}`;
  } catch(e){}
  
  let device = navigator.userAgent.includes("Android") ? "Android" : "PC";
  let time = new Date().toLocaleString();
  
  document.getElementById('popupDate').innerText = `Date: ${time}`;
  document.getElementById('popupDetails').innerHTML = `
    <div class="popup-row"><b>Latency:</b> ${result.latency} ms</div>
    <div class="popup-row"><b>Download:</b> ${result.download} Mbps</div>
    <div class="popup-row"><b>Upload:</b> ${result.upload} Mbps</div>
    <div class="popup-row"><b>Jitter:</b> ${result.jitter} ms</div>
    <div class="popup-row"><b>Packet Loss:</b> ${result.packetLoss}%</div>
    <div class="popup-row"><b>Device:</b> ${device}</div>
    <div class="popup-row"><b>IP:</b> ${ip}</div>
    <div class="popup-row"><b>ISP:</b> ${isp}</div>
    <div class="popup-row"><b>Location:</b> ${location}</div>
  `;
  document.getElementById('popup').style.display = 'flex';
}

function closePopup() {
  document.getElementById('popup').style.display = 'none';
}

// DOWNLOAD AS JPG
function downloadResult() {
  alert('Screenshot feature: Phone ka screenshot le lo bhai. Browser me direct JPG save karne ke liye extra library chahiye. Abhi ke liye Volume Down + Power button dabao.');
}

// SHARE
async function shareResult() {
  let text = `My Speed Test Result\nLatency: ${result.latency}ms\nDownload: ${result.download}Mbps\nUpload: ${result.upload}Mbps\nJAY JAGANNATH - PUNYA BINAY SWAIN`;
  if(navigator.share) {
    navigator.share({ title: 'Speed Test Result', text: text });
  } else {
    navigator.clipboard.writeText(text);
    alert('Result copied! Ab kisi bhi app me paste kar do.');
  }
}
</script>
</body>
</html>
