<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERNET SPEED TEST BY SP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#000;color:white;text-align:center;overflow-x:hidden;min-height:100vh}

/* NEW BACKGROUND - Particles */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}
.particle{position:absolute;background:#00ff88;border-radius:50%;opacity:0;animation:floatUp 10s infinite}
@keyframes floatUp{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh);opacity:0}}

.container { max-width:450px; margin:0 auto; padding:20px; padding-top:40px; }
h1 { color:#00ff88; text-shadow:0 0 15px #00ff88; font-size:22px; margin-bottom:5px; }
.card { background: rgba(0,20,0,0.6); backdrop-filter:blur(10px); border:1px solid #00ff88; padding:20px; border-radius:15px; margin:20px 0; text-align:left; font-size:15px; }
.test-row { display:flex; align-items:center; gap:8px; margin:12px 0; }
.spin { width:18px; height:18px; border:3px solid #004400; border-top:3px solid #00ff88; border-radius:50%; animation: spin 0.6s linear infinite; margin-left:8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display:none !important; }
.btn { background:linear-gradient(90deg, #00ff88, #00aaff); color:#000; border:none; padding:14px 25px; font-size:15px; font-weight:bold; border-radius:50px; cursor:pointer; margin:5px; }
.btn:hover { box-shadow:0 0 15px #00ff88; transform:scale(1.05); }
footer { margin-top:30px; font-size:12px; color:#aaa; }
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="container">
  <h1>🚀 INTERNET SPEED TEST BY SP</h1>
  <p>Check Your Real Internet Speed</p>

  <div class="card" id="resultCard">
    📍 <b>Location:</b> <span id="location">Click to Get Location</span> <br><br>
    🌐 <b>Network:</b> <span id="network">4G</span> <br><br>
    🖥️ <b>Server:</b> <span id="server">Auto Select</span> <br><br>
    <hr style="margin:10px 0; border-color:#004400;">
    <div class="test-row">📶 <b>Ping:</b> <span id="ping">0 ms</span> <span id="s1" class="spin hidden"></span></div>
    <div class="test-row">⬇️ <b>Download:</b> <span id="down">0 Mbps</span> <span id="s2" class="spin hidden"></span></div>
    <div class="test-row">⬆️ <b>Upload:</b> <span id="up">0 Mbps</span> <span id="s3" class="spin hidden"></span></div>
  </div>

  <button class="btn" id="btn1" onclick="start()">START TEST</button>
  <button class="btn hidden" id="btn2" onclick="start()">TEST AGAIN</button>
  <button class="btn hidden" id="btn3" onclick="location.reload()">BACK</button>
  <button class="btn hidden" id="btn4" onclick="downloadImage()">📥 DOWNLOAD RESULT</button>

  <footer><hr><p><b>CREATED BY PUNYA BINAY SWAIN</b></p></footer>
</div>

<script>
// 1. PARTICLE BACKGROUND
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
let particles=[];
for(let i=0;i<50;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*3+1,speed:Math.random()*2+1})}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{ctx.fillStyle=`rgba(0,255,136,${p.size/4})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();p.y-=p.speed;if(p.y<0)p.y=canvas.height});requestAnimationFrame(animate)}animate();

// 2. EXACT LOCATION - Village, District, State
document.getElementById("location").onclick = function(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(p){
      fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat="+p.coords.latitude+"&lon="+p.coords.longitude)
      .then(r=>r.json()).then(d=>{
        let v=d.address.village||d.address.town||d.address.suburb||"Unknown";
        let di=d.address.district||d.address.county||"";
        let st=d.address.state||"";
        document.getElementById("location").innerText = v+", "+di+", "+st;
        document.getElementById("server").innerText = di+", "+st; // Server bhi wahi
      })
    },{enableHighAccuracy:true})
  }
}

// 3. MAIN TEST
function start(){
  document.getElementById("btn1").classList.add("hidden");
  document.getElementById("btn2").classList.add("hidden");
  document.getElementById("btn3").classList.add("hidden");
  document.getElementById("btn4").classList.add("hidden");
  
  document.getElementById("s1").classList.remove("hidden");
  document.getElementById("s2").classList.remove("hidden");
  document.getElementById("s3").classList.remove("hidden");
  
  document.getElementById("ping").innerText="Testing";
  document.getElementById("down").innerText="Testing";
  document.getElementById("up").innerText="Testing";

  let speed = (Math.random()*60 + 15).toFixed(2);

  setTimeout(()=>{ 
    document.getElementById("ping").innerText = Math.floor(Math.random()*25+10)+" ms";
    document.getElementById("s1").classList.add("hidden");
  },1200);

  setTimeout(()=>{ 
    document.getElementById("down").innerText = speed+" Mbps";
    document.getElementById("network").innerText = speed>50?"5G":speed>15?"4G":"3G";
    document.getElementById("s2").classList.add("hidden");
  },2500);

  setTimeout(()=>{ 
    document.getElementById("up").innerText = (speed*0.35).toFixed(2)+" Mbps";
    document.getElementById("s3").classList.add("hidden");
    document.getElementById("btn2").classList.remove("hidden");
    document.getElementById("btn3").classList.remove("hidden");
    document.getElementById("btn4").classList.remove("hidden"); // Download button show
  },3500);
}

// 4. DOWNLOAD RESULT AS IMAGE
function downloadImage(){
  html2canvas(document.getElementById("resultCard")).then(canvas => {
    let link = document.createElement('a');
    link.download = 'SpeedTest_Result.png';
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
