<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedTestX Pro by Punya Binay</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body {
    background: radial-gradient(circle at top, #0a1128 0%, #050A18 100%);
    color: #fff;
    text-align: center;
    padding: 20px;
    min-height: 100vh;
  }
 .container { max-width: 650px; margin: auto; }

  h1 { color: #00FFC6; font-size: 28px; font-weight: 700; text-shadow: 0 0 15px #00FFC6; }
  h1 span { color: #FFA500; }
 .subtitle { color: #aaa; margin-bottom: 20px; }

 .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 25px;
    margin: 20px auto;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  }

  /* ATTRACTIVE GAUGE CLOCK */
 .gauge-container { position: relative; width: 300px; height: 160px; margin: 0 auto 20px; }
 .gauge-bg {
    width: 300px; height: 150px;
    border: 20px solid rgba(255,255,255,0.1);
    border-bottom: none;
    border-radius: 300px 300px 0 0;
  }
 .gauge-arc {
    width: 300px; height: 150px;
    border: 20px solid transparent;
    border-top: 20px solid #00FFC6;
    border-radius: 300px 300px 0 0;
    position: absolute; top: 0; left: 0;
    transform-origin: center bottom;
    transform: rotate(-90deg);
    transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    filter: drop-shadow(0 0 10px #00FFC6);
  }
 .gauge-value {
    position: absolute; width: 100%; top: 70px;
    font-size: 42px; font-weight: 700; color: #fff;
  }
 .gauge-unit { font-size: 14px; color: #aaa; }

  /* CIRCLE RESULTS */
 .results { display: flex; justify-content: space-around; margin: 20px 0; flex-wrap: wrap; gap: 15px; }
 .circle-result {
    width: 115px; height: 115px; border-radius: 50%;
    background: linear-gradient(135deg, #FFA500, #FF6B00);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #000; font-weight: 700; box-shadow: 0 0 20px rgba(255, 165, 0, 0.6);
  }
 .circle-result.val { font-size: 24px; }
 .circle-result.label { font-size: 11px; margin-top: 4px; }

  /* BUTTONS */
  button {
    background: linear-gradient(90deg, #6A5ACD, #00FFC6);
    border: none; padding: 15px 30px; border-radius: 12px;
    color: #000; font-weight: 700; font-size: 16px;
    cursor: pointer; margin: 10px 5px; width: 95%;
    transition: 0.3s; box-shadow: 0 4px 15px rgba(0,255,198,0.3);
  }
  button:hover { transform: translateY(-2px); }
 .btn-download { background: linear-gradient(90deg, #FF8C00, #FFD700); }

  /* DEVICE INFO */
 .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; text-align: left; }
 .info-row span:first-child { opacity: 0.8; }
 .info-row span:last-child { font-weight: 600; text-align: right; }

 .footer { margin-top: 30px; font-size: 12px; color: #666; }
 .tiranga { height: 4px; background: linear-gradient(90deg, #FF9933 33%, #fff 33%, #fff 66%, #138808 66%); margin-top: 20px; border-radius: 2px; }
 .loading { animation: pulse 1s infinite; }
  @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
</style>
</head>
<body>
<div class="container">

<h1>⚡ SPEEDTEST <span>X PRO</span></h1>
<p class="subtitle">BY PUNYA BINAY</p>

<div class="card">
  <h3 style="color:#00FFC6; margin-bottom:15px;">SPEED TEST</h3>

  <!-- ATTRACTIVE GAUGE -->
  <div class="gauge-container">
    <div class="gauge-bg"></div>
    <div class="gauge-arc" id="gaugeArc"></div>
    <div class="gauge-value">
      <div id="gaugeValue">0.00</div>
      <div class="gauge-unit" id="gaugeUnit">Mbps</div>
    </div>
  </div>

  <!-- CIRCLE RESULTS -->
  <div class="results">
    <div class="circle-result"><div class="val" id="ping">0</div><div class="label">ms Latency</div></div>
    <div class="circle-result"><div class="val" id="download">0</div><div class="label">Mbps Download</div></div>
    <div class="circle-result"><div class="val" id="upload">0</div><div class="label">Mbps Upload</div></div>
  </div>

  <button onclick="startTest()">START TEST</button>
  <button onclick="startTest()">TEST AGAIN</button>
</div>

<div class="card">
  <button onclick="getDeviceInfo()">📍 GET PRECISE DEVICE LOCATION</button>
  <h3 style="color:#00FFC6; margin: 15px 0;">DEVICE INFORMATION</h3>
  <div class="info-row"><span>📱 DEVICE</span><span id="device" class="loading">Detecting...</span></div>
  <div class="info-row"><span>📍 LOCATION</span><span id="location" class="loading">-</span></div>
  <div class="info-row"><span>🏷️ IP ADDRESS</span><span id="ip" class="loading">-</span></div>
  <div class="info-row"><span>📡 ISP / NETWORK</span><span id="isp" class="loading">-</span></div>
  <div class="info-row"><span>📶 NETWORK TYPE</span><span id="network" class="loading">-</span></div>
  <button class="btn-download" onclick="downloadReport()">⬇️ DOWNLOAD REPORT</button>
</div>

<div class="tiranga"></div>
<p class="footer">Made with ❤️ by Punya Binay | SpeedTestX Pro v2.0</p>

</div>

<script>
let testRunning = false;

async function startTest() {
  if(testRunning) return;
  testRunning = true;

  const gauge = document.getElementById('gaugeArc');
  const val = document.getElementById('gaugeValue');
  const unit = document.getElementById('gaugeUnit');

  // Reset
  gauge.style.transform = 'rotate(-90deg)';
  val.innerText = '0.00';

  // 1. PING TEST - Real
  unit.innerText = 'ms';
  const pingStart = performance.now();
  await fetch('https://www.google.com/favicon.ico?'+Date.now(), {mode: 'no-cors'});
  const ping = Math.round(performance.now() - pingStart);
  animateGauge(ping, 300, ping);
  document.getElementById('ping').innerText = ping;

  // 2. DOWNLOAD TEST - Real 10MB file
  await new Promise(r => setTimeout(r, 1000));
  unit.innerText = 'Mbps';
  const downStart = performance.now();
  const downRes = await fetch('https://speed.cloudflare.com/__down?bytes=10000000&'+Date.now());
  const downBlob = await downRes.blob();
  const downTime = (performance.now() - downStart) / 1000;
  const downSpeed = ((10 * 8) / downTime).toFixed(2); // 10MB to Mbps
  animateGauge(downSpeed, 500, downSpeed);
  document.getElementById('download').innerText = downSpeed;

  // 3. UPLOAD TEST - Real
  await new Promise(r => setTimeout(r, 1000));
  const upData = new Blob([new ArrayBuffer(5 * 1024 * 1024)]); // 5MB
  const upStart = performance.now();
  await fetch('https://httpbin.org/post', {method: 'POST', body: upData, mode: 'no-cors'});
  const upTime = (performance.now() - upStart) / 1000;
  const upSpeed = ((5 * 8) / upTime).toFixed(2);
  animateGauge(upSpeed, 200, upSpeed);
  document.getElementById('upload').innerText = upSpeed;

  testRunning = false;
}

function animateGauge(value, max, displayVal) {
  const gauge = document.getElementById('gaugeArc');
  const val = document.getElementById('gaugeValue');
  let deg = Math.min((value / max) * 180, 180) - 90;
  gauge.style.transform = `rotate(${deg}deg)`;

  let i = 0;
  let interval = setInterval(() => {
    i += value/30;
    if(i >= value) { i = value; clearInterval(interval); }
    val.innerText = parseFloat(i).toFixed(2);
  }, 30);
}

// ACCURATE IP + LOCATION + ISP
async function getDeviceInfo() {
  document.getElementById('device').innerText = navigator.userAgent.split(')[1].split(')')[0];
  document.getElementById('network').innerText = navigator.connection?.effectiveType?.toUpperCase() || 'UNKNOWN';

  try {
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    document.getElementById('ip').innerText = data.ip;
    document.getElementById('location').innerText = `${data.city}, ${data.region}`;
    document.getElementById('isp').innerText = data.org; // Tower/ISP name
  } catch(e) {
    document.getElementById('ip').innerText = 'Error';
  }
}

function downloadReport() {
  const data = `
SpeedTestX Pro Report
Download: ${document.getElementById('download').innerText} Mbps
Upload: ${document.getElementById('upload').innerText} Mbps
Ping: ${document.getElementById('ping').innerText} ms
IP: ${document.getElementById('ip').innerText}
Location: ${document.getElementById('location').innerText}
  `;
  const blob = new Blob([data], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'SpeedTest_Report.txt'; a.click();
}

getDeviceInfo(); // Page load pe auto
</script>

</body>
</html>
