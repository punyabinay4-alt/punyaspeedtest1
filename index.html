<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO SPEED TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { width: 100%; max-width: 500px; background: #1a1a1a; border-radius: 24px; padding: 30px; box-shadow: 0 0 50px rgba(0, 123, 255, 0.2); border: 1px solid #2a2a2a; }
.header { text-align: center; margin-bottom: 30px; }
.title { font-size: 24px; font-weight: 800; color: #fff; }
.subtitle { font-size: 13px; color: #888; margin-top: 5px; }

/* OOKLA STYLE GAUGE */
.gauge { position: relative; width: 300px; height: 150px; margin: 0 auto 30px; }
.gauge-svg { width: 100%; height: 100%; }
.gauge-bg { fill: none; stroke: #2a2a2a; stroke-width: 20; }
.gauge-fill { fill: none; stroke: #007bff; stroke-width: 20; stroke-linecap: round; stroke-dasharray: 471; stroke-dashoffset: 471; transition: stroke-dashoffset 0.3s ease-out; }
.gauge-needle { stroke: #fff; stroke-width: 3; stroke-linecap: round; transform-origin: 150px 150px; transition: transform 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
.gauge-center { fill: #007bff; }
.gauge-text { position: absolute; top: 70%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
.gauge-value { font-size: 48px; font-weight: 800; color: #fff; }
.gauge-label { font-size: 14px; color: #888; font-weight: 600; }

.status { text-align: center; color: #007bff; font-weight: 600; font-size: 15px; margin-bottom: 20px; min-height: 22px; }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
.result-box { background: #222; padding: 20px; border-radius: 16px; text-align: center; }
.result-box .val { font-size: 28px; font-weight: 800; color: #fff; }
.result-box .label { font-size: 12px; color: #888; font-weight: 600; margin-top: 5px; }

.btn { width: 100%; background: linear-gradient(135deg, #007bff, #0056b3); color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; transition: all 0.2s; }
.btn:hover { transform: scale(1.02); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.device { margin-top: 25px; padding-top: 20px; border-top: 1px solid #2a2a2a; }
.device h3 { color: #fff; font-size: 14px; margin-bottom: 15px; font-weight: 700; }
.row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 13px; color: #aaa; }
.row span:last-child { color: #fff; font-weight: 600; text-align: right; max-width: 60%; }
.badge { background: #007bff; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }

.popup { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 999; }
.popup-box { background: #1a1a1a; border-radius: 20px; width: 90%; max-width: 450px; padding: 25px; border: 1px solid #2a2a2a; }
.popup h2 { color: #fff; text-align: center; margin-bottom: 20px; }
.popup .row { border-bottom: 1px solid #2a2a2a; }
.popup .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">PRO SPEED TEST</div>
    <div class="subtitle">By Punya Binay Swain</div>
  </div>

  <div class="gauge">
    <svg class="gauge-svg" viewBox="0 0 300 150">
      <path class="gauge-bg" d="M 20 150 A 130 130 0 0 1 280 150"></path>
      <path class="gauge-fill" id="gaugeFill" d="M 20 150 A 130 130 0 0 1 280 150"></path>
      <line id="needle" x1="150" y1="150" x2="150" y2="30" class="gauge-needle"/>
      <circle cx="150" cy="150" r="8" class="gauge-center"/>
    </svg>
    <div class="gauge-text">
      <div class="gauge-value" id="speedValue">0</div>
      <div class="gauge-label" id="speedLabel">Mbps</div>
    </div>
  </div>

  <div class="status" id="status">Press START to begin test</div>

  <div class="results">
    <div class="result-box"><div class="val" id="download">0.00</div><div class="label">DOWNLOAD</div></div>
    <div class="result-box"><div class="val" id="upload">0.00</div><div class="label">UPLOAD</div></div>
  </div>

  <button class="btn" id="startBtn" onclick="startTest()">START TEST</button>

  <div class="device">
    <h3>CONNECTION DETAILS</h3>
    <div class="row"><span>Device</span><span id="device">-</span></div>
    <div class="row"><span>Exact Location</span><span id="location">Getting...</span></div>
    <div class="row"><span>IP Address</span><span id="ip">-</span></div>
    <div class="row"><span>ISP</span><span id="isp">-</span></div>
    <div class="row"><span>Network</span><span id="network">-</span></div>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h2>Test Complete</h2>
    <div id="popupData"></div>
    <div class="btns">
      <button class="btn" onclick="startTest()">Test Again</button>
      <button class="btn" style="background:#333" onclick="document.getElementById('popup').style.display='none'">Close</button>
    </div>
  </div>
</div>

<script>
let running = false;
let result = {ping:0, download:0, upload:0};
let userInfo = {};

// SLOW TEST FOR ACCURATE RESULT - 20 SEC
async function startTest() {
  if(running) return;
  running = true;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('popup').style.display = 'none';
  resetAll();

  await getInfo();
  await getExactLocation();
  await testPing();
  await testDownload();
  await testUpload();

  document.getElementById('status').innerText = 'Test Complete';
  showPopup();
  running = false;
  document.getElementById('startBtn').disabled = false;
}

function resetAll() {
  result = {ping:0, download:0, upload:0};
  document.getElementById('download').innerText = '0.00';
  document.getElementById('upload').innerText = '0.00';
  updateGauge(0);
}

// REAL GAUGE
function updateGauge(value, type='download') {
  let max = type === 'download' ? 1000 : 200;
  let percent = Math.min(value / max, 1);
  let offset = 471 - (471 * percent);
  document.getElementById('gaugeFill').style.strokeDashoffset = offset;
  let deg = (percent * 180) - 90;
  document.getElementById('needle').style.transform = `rotate(${deg}deg)`;
  document.getElementById('speedValue').innerText = value.toFixed(2);
  document.getElementById('speedLabel').innerText = type === 'download' ? 'Mbps Download' : 'Mbps Upload';
}

// EXACT VILLAGE LOCATION
async function getExactLocation() {
  return new Promise((resolve) => {
    if(navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        let lat = pos.coords.latitude; let lon = pos.coords.longitude;
        try{
          let res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18`);
          let data = await res.json();
          let addr = data.address;
          let village = addr.village || addr.town || addr.suburb || addr.city || 'Unknown';
          userInfo.location = `${village}, ${addr.district || addr.county}, ${addr.state}`;
        }catch(e){ userInfo.location = 'Location Error'; }
        document.getElementById('location').innerText = userInfo.location;
        resolve();
      }, () => { document.getElementById('location').innerText = 'Permission Denied'; resolve(); }, {enableHighAccuracy: true, timeout: 10000});
    } else { resolve(); }
  });
}

async function testPing() {
  document.getElementById('status').innerText = 'Testing Ping...';
  let s = performance.now();
  await fetch('https://www.google.com/favicon.ico?t=' + Date.now(), {mode: 'no-cors'});
  result.ping = Math.round(performance.now()-s);
}

// SLOWER TEST FOR REAL RESULT
async function testDownload() {
  document.getElementById('status').innerText = 'Testing Download...';
  let startTime = performance.now();
  let totalBytes = 0;
  let duration = 20000; // 20 SECONDS for accuracy

  let interval = setInterval(() => {
    let elapsed = (performance.now() - startTime) / 1000;
    if(elapsed > 2){
      let speed = (totalBytes * 8) / 1000000 / elapsed;
      document.getElementById('download').innerText = speed.toFixed(2);
      updateGauge(speed, 'download');
    }
  }, 200);

  const worker = async () => {
    while(performance.now() - startTime < duration) {
      try{
        let res = await fetch('https://speed.cloudflare.com/__down?bytes=100000&t=' + Date.now());
        let reader = res.body.getReader();
        while(true){
          let {done, value} = await reader.read();
          if(done) break;
          totalBytes += value.length;
        }
      }catch(e){}
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  clearInterval(interval);
  let totalTime = (performance.now()-startTime)/1000;
  result.download = ((totalBytes*8)/1000000/totalTime).toFixed(2);
}

async function testUpload() {
  document.getElementById('status').innerText = 'Testing Upload...';
  let startTime = performance.now();
  let totalBytes = 0;
  let duration = 15000; // 15 SECONDS
  let data = new Blob([new Uint8Array(5 * 1024 * 1024)]); // 5MB chunks

  let interval = setInterval(() => {
    let elapsed = (performance.now() - startTime) / 1000;
    if(elapsed > 2){
      let speed = (totalBytes * 8) / 1000000 / elapsed;
      document.getElementById('upload').innerText = speed.toFixed(2);
      updateGauge(speed, 'upload');
    }
  }, 200);

  const worker = async () => {
    while(performance.now() - startTime < duration) {
      try{
        await fetch('https://speed.cloudflare.com/__up?t=' + Date.now(), {method:'POST', body:data});
        totalBytes += data.size;
      }catch(e){}
    }
  }
  await Promise.all([worker(), worker()]);
  clearInterval(interval);
  let totalTime = (performance.now()-startTime)/1000;
  result.upload = ((totalBytes*8)/1000000/totalTime).toFixed(2);
}

function showPopup() {
  let html = `
    <div class="row"><span>Download</span><span>${result.download} Mbps</span></div>
    <div class="row"><span>Upload</span><span>${result.upload} Mbps</span></div>
    <div class="row"><span>Ping</span><span>${result.ping} ms</span></div>
    <div class="row"><span>Location</span><span>${userInfo.location}</span></div>
    <div class="row"><span>IP</span><span>${userInfo.ip}</span></div>
    <div class="row"><span>ISP</span><span>${userInfo.isp}</span></div>
    <div class="row"><span>Network</span><span>${userInfo.network}</span></div>
  `;
  document.getElementById('popupData').innerHTML = html;
  document.getElementById('popup').style.display = 'flex';
}

// BETTER NETWORK DETECTION
function getNetworkType() {
  if(navigator.connection) {
    let d = navigator.connection.downlink;
    if(d > 80) return '<span class="badge">5G</span>';
    if(d > 15) return '<span class="badge">4G</span>';
    if(d > 3) return '<span class="badge">3G</span>';
    return '<span class="badge">2G</span>';
  }
  return '<span class="badge">WiFi</span>';
}

async function getInfo() {
  userInfo.device = navigator.userAgent.includes("Android")? "Android" : "PC";
  userInfo.network = getNetworkType();
  document.getElementById('device').innerText = userInfo.device;
  document.getElementById('network').innerHTML = userInfo.network;
  
  try{
    let res = await fetch('https://ipapi.co/json/');
    let data = await res.json();
    userInfo.ip = data.ip; 
    userInfo.isp = data.org;
  }catch(e){ userInfo.ip = "N/A"; userInfo.isp = "N/A"; }
  document.getElementById('ip').innerText = userInfo.ip;
  document.getElementById('isp').innerText = userInfo.isp;
}
getInfo();
</script>
</body>
</html>
