<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERNET SPEED TEST BY SP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Roboto, Arial, sans-serif}
body{background:#010b1a;color:#00aaff;text-align:center;overflow-x:hidden;min-height:100vh}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 20% 50%, #003366 0%, #010b1a 50%)}
.container { max-width:500px; margin:0 auto; padding:20px; padding-top:25px; }
h1 { color:#00aaff; text-shadow:0 0 20px #00aaff; font-size:26px; font-weight:800; letter-spacing:1px; }
.subtitle { color:#66ddff; font-size:14px; margin-bottom:25px; }
.card { background: rgba(5,20,40,0.7); backdrop-filter:blur(25px); border:1px solid rgba(0,170,255,0.3); padding:25px; border-radius:24px; margin:20px 0; text-align:left; font-size:15px; color:#00aaff; box-shadow:0 10px 40px rgba(0,170,255,0.25); }
.row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(0,170,255,0.1); }
.row:last-child { border:none; }
.label { display:flex; align-items:center; gap:8px; font-weight:600; color:#66ddff; }
.value { font-weight:700; color:#fff; font-size:16px; }
hr { margin:12px 0; border:none; border-top:1px solid rgba(0,170,255,0.2); }
.progress { height:4px; background:rgba(0,170,255,0.2); border-radius:10px; overflow:hidden; margin-top:5px; }
.progress-bar { height:100%; width:0%; background:linear-gradient(90deg, #0088ff, #00aaff); transition:width 0.3s; }
.spin { width:20px; height:20px; border:3px solid rgba(0,170,255,0.3); border-top:3px solid #00aaff; border-radius:50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display:none !important; }
.btn { background:linear-gradient(90deg, #0077ff, #00aaff); color:#000; border:none; padding:17px 25px; font-size:16px; font-weight:800; border-radius:14px; cursor:pointer; margin:10px 0; width:100%; transition:0.3s; box-shadow:0 5px 20px rgba(0,170,255,0.4); }
.btn:hover { transform:translateY(-3px); box-shadow:0 8px 25px rgba(0,170,255,0.6); }
.location-btn { background:linear-gradient(90deg, #ff9500, #ffaa00); }
footer { margin-top:30px; font-size:12px; color:#66ddff; font-weight:700; letter-spacing:0.5px; }
</style>
</head>
<body>
<div id="bg"></div>

<div class="container">
  <h1>🚀 SPEED TEST</h1>
  <p class="subtitle">POWERED BY SP • ACCURATE RESULTS</p>

  <div class="card" id="resultCard">
    <button class="btn location-btn" onclick="getLocation()">📍 ENABLE LOCATION</button>
    <div class="row"><div class="label">📍 Location</div> <div class="value" id="location">Not Set</div></div>
    <div class="row"><div class="label">🌐 Network</div> <div class="value" id="network">--</div></div>
    <div class="row"><div class="label">🖥️ Server</div> <div class="value" id="server">Mumbai, India</div></div>
    <hr>
    <div class="row"><div class="label">📶 Ping</div> <div class="value"><span id="ping">0 ms</span> <span id="s1" class="spin hidden"></span></div></div>
    <div class="progress"><div id="p1" class="progress-bar"></div></div>
    <div class="row"><div class="label">⬇️ Download</div> <div class="value"><span id="down">0 Mbps</span> <span id="s2" class="spin hidden"></span></div></div>
    <div class="progress"><div id="p2" class="progress-bar"></div></div>
    <div class="row"><div class="label">⬆️ Upload</div> <div class="value"><span id="up">0 Mbps</span> <span id="s3" class="spin hidden"></span></div></div>
    <div class="progress"><div id="p3" class="progress-bar"></div></div>
  </div>

  <button class="btn" id="btn1" onclick="start()">START</button>
  <button class="btn hidden" id="btn2" onclick="start()">TEST AGAIN</button>
  <button class="btn hidden" id="btn3" onclick="location.reload()">BACK</button>
  <button class="btn hidden" id="btn4" onclick="downloadResult()">📥 DOWNLOAD REPORT</button>

  <footer>CREATED AND DEVELOPED BY<br>PUNYA BINAY SWAIN</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function getLocation(){
  if(navigator.geolocation){
    document.getElementById("location").innerText = "Detecting...";
    navigator.geolocation.getCurrentPosition(function(p){
      fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat="+p.coords.latitude+"&lon="+p.coords.longitude)
      .then(r=>r.json()).then(d=>{
        let city=d.address.city||d.address.town||"Unknown";
        let state=d.address.state||"India";
        document.getElementById("location").innerText = city+", "+state;
      })
    })
  }
}

function getNetworkType(speed){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  let apiType = c ? c.effectiveType : null;
  if(apiType && apiType.includes('4g')) return "4G LTE";
  if(apiType && apiType.includes('3g')) return "3G";
  if(apiType && apiType.includes('2g')) return "2G";
  if(speed > 25) return "5G";
  if(speed > 10) return "4G LTE";
  if(speed > 3) return "3G";
  return "2G";
}

async function start(){
  document.getElementById("btn1").classList.add("hidden");
  showSpinner(true);
  
  let pings = [];
  for(let url of ['https://1.1.1.1/cdn-cgi/trace', 'https://www.google.com/generate_204']){
    let t1 = Date.now();
    await fetch(url+'?r='+Math.random(), {cache:'no-store', mode:'no-cors'});
    pings.push(Date.now() - t1);
  }
  let ping = Math.min(...pings);
  document.getElementById("ping").innerText = ping+" ms";
  document.getElementById("p1").style.width = Math.min(100, 300/ping*100)+"%";
  showSpinner(false,1);

  let totalBytes = 0;
  let startTime = Date.now();
  let promises = [];
  for(let i=0; i<4; i++){ promises.push(downloadChunk()); }
  await Promise.all(promises);
  let duration = (Date.now() - startTime)/1000;
  let down = ((totalBytes*8)/duration)/1000000;
  
  document.getElementById("down").innerText = down.toFixed(2)+" Mbps";
  document.getElementById("p2").style.width = Math.min(100, down/100*100)+"%";
  showSpinner(false,2);

  let upData = new Blob([new Array(4*1024*1024).fill('a')]);
  startTime = Date.now();
  await fetch('https://speed.cloudflare.com/__up', {method:'POST', body:upData, cache:'no-store'});
  let upDuration = (Date.now() - startTime)/1000;
  let up = ((upData.size*8)/upDuration)/1000000;
  
  document.getElementById("up").innerText = up.toFixed(2)+" Mbps";
  document.getElementById("p3").style.width = Math.min(100, up/50*100)+"%";
  showSpinner(false,3);

  document.getElementById("network").innerText = getNetworkType(down);

  document.getElementById("btn2").classList.remove("hidden");
  document.getElementById("btn3").classList.remove("hidden");
  document.getElementById("btn4").classList.remove("hidden");
  
  async function downloadChunk(){
    let res = await fetch('https://speed.cloudflare.com/__down?bytes=5000000&r='+Math.random(), {cache:'no-store'});
    let blob = await res.blob();
    totalBytes += blob.size;
  }
}

function showSpinner(show, num){
  if(num) document.getElementById("s"+num).classList.toggle("hidden", !show);
  else {
    document.getElementById("s1").classList.toggle("hidden", !show);
    document.getElementById("s2").classList.toggle("hidden", !show);
    document.getElementById("s3").classList.toggle("hidden", !show);
  }
}

function downloadResult(){
  html2canvas(document.getElementById("resultCard"), {
    backgroundColor:'#051428',
    scale:2
  }).then(canvas => {
    let link = document.createElement('a');
    link.download = 'SpeedReport_SP.jpg'; 
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
  });
}

window.onload = () => {
  const c = navigator.connection;
  if(c) document.getElementById("network").innerText = c.effectiveType.toUpperCase();
}
</script>
</body>
</html>
