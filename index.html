<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERNET SPEED TEST BY SP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arial',sans-serif;background:#000;color:yellow;text-align:center;overflow-x:hidden;min-height:100vh}

/* FALLING STARS */
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:#000}

/* INTERNET SPEED DESIGN */
h1 { 
  color:yellow; 
  text-shadow:0 0 10px yellow, 0 0 20px yellow, 0 0 30px #ffaa00; 
  font-size:24px; 
  margin-bottom:5px;
  animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 10px yellow, 0 0 20px yellow}
  to{text-shadow:0 0 20px yellow, 0 0 30px #ffaa00, 0 0 40px #ffaa00}
}

.container { max-width:450px; margin:0 auto; padding:20px; padding-top:40px; position:relative; z-index:2; }
.card { background: rgba(30,30,0,0.9); backdrop-filter:blur(15px); border:2px solid yellow; padding:20px; border-radius:20px; margin:20px 0; text-align:left; font-size:16px; color:yellow; box-shadow:0 0 30px rgba(255,255,0,0.3); }
.test-row { display:flex; align-items:center; gap:8px; margin:15px 0; }
.spin { width:18px; height:18px; border:3px solid #444400; border-top:3px solid yellow; border-radius:50%; animation: spin 0.8s linear infinite; display:inline-block; margin-left:8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display:none !important; }
.btn { background:linear-gradient(90deg, yellow, #ffaa00); color:#000; border:none; padding:15px 25px; font-size:16px; font-weight:bold; border-radius:50px; cursor:pointer; margin:8px 5px; width:90%; transition:0.3s; }
.btn:hover { box-shadow:0 0 25px yellow; transform:scale(1.03); }
.location-btn { background:orange; color:#000; }
footer { margin-top:30px; font-size:13px; color:yellow; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="container">
  <h1>🚀 INTERNET SPEED TEST BY SP</h1>
  <p>Check Your Real Internet Speed</p>

  <div class="card" id="resultCard">
    <button class="btn location-btn" onclick="getLocation()">📍 TAP TO ALLOW LOCATION</button><br>
    📍 <b>Location:</b> <span id="location">Click button above</span> <br><br>
    🌐 <b>Network:</b> <span id="network">Checking...</span> <br><br>
    🖥️ <b>Server:</b> <span id="server">Cloudflare India - Fastest</span> <br><br>
    <hr style="margin:15px 0; border-color:#444400;">
    <div class="test-row">📶 <b>Ping:</b> <span id="ping">0 ms</span> <span id="s1" class="spin hidden"></span></div>
    <div class="test-row">⬇️ <b>Download:</b> <span id="down">0 Mbps</span> <span id="s2" class="spin hidden"></span></div>
    <div class="test-row">⬆️ <b>Upload:</b> <span id="up">0 Mbps</span> <span id="s3" class="spin hidden"></span></div>
  </div>

  <button class="btn" id="btn1" onclick="start()">START TEST</button>
  <button class="btn hidden" id="btn2" onclick="start()">TEST AGAIN</button>
  <button class="btn hidden" id="btn3" onclick="location.reload()">BACK</button>
  <button class="btn hidden" id="btn4" onclick="downloadResult()">📥 DOWNLOAD JPG</button>

  <footer><hr><p><b>CREATED AND DEVELOPED BY<br>PUNYA BINAY SWAIN</b></p></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// 1. FALLING STARS
const canvas = document.getElementById('stars'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let stars = []; for(let i=0; i<150; i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+1,speed:Math.random()*2+0.5})}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,0,${s.size/3})`;ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();s.y+=s.speed;if(s.y>canvas.height){s.y=-10;s.x=Math.random()*canvas.width}});requestAnimationFrame(animate)}animate();

// 2. ACCURATE LOCATION BUTTON
function getLocation(){
  if(navigator.geolocation){
    document.getElementById("location").innerText = "Getting Location...";
    navigator.geolocation.getCurrentPosition(function(p){
      fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat="+p.coords.latitude+"&lon="+p.coords.longitude)
      .then(r=>r.json()).then(d=>{
        let v=d.address.village||d.address.town||d.address.suburb||"Unknown";
        let di=d.address.district||"";
        let st=d.address.state||"India";
        document.getElementById("location").innerText = v+", "+di+", "+st;
      })
    },()=>{document.getElementById("location").innerText = "Permission Denied"})
  }else{alert("Location not supported")}
}

// 3. PHONE KA ASLI NETWORK
window.onload = function(){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(c) document.getElementById("network").innerText = c.effectiveType.toUpperCase();
}

// 4. TRAI JAISE ACCURATE SPEED TEST
async function start(){
  document.getElementById("btn1").classList.add("hidden");
  document.getElementById("s1").classList.remove("hidden");
  document.getElementById("s2").classList.remove("hidden");
  document.getElementById("s3").classList.remove("hidden");
  
  // PING - 3 server, sabse kam lega
  let pings = [];
  for(let url of ['https://1.1.1.1/cdn-cgi/trace', 'https://www.google.com/generate_204', 'https://www.cloudflare.com/cdn-cgi/trace']){
    let t1 = Date.now();
    await fetch(url+'?r='+Math.random(), {cache:'no-store', mode:'no-cors'});
    pings.push(Date.now() - t1);
  }
  document.getElementById("ping").innerText = Math.min(...pings)+" ms";
  document.getElementById("s1").classList.add("hidden");

  // DOWNLOAD - 10MB x 3 times, average nikalega. TRAI jaisa
  let speeds = [];
  for(let i=0; i<3; i++){
    let t1 = Date.now();
    let res = await fetch('https://speed.cloudflare.com/__down?bytes=10000000&r='+Math.random(), {cache:'no-store'});
    let blob = await res.blob();
    let duration = (Date.now() - t1)/1000;
    speeds.push(((blob.size*8)/duration)/1000000);
    await new Promise(r=>setTimeout(r,300));
  }
  let down = speeds.reduce((a,b)=>a+b)/3;
  document.getElementById("down").innerText = down.toFixed(2)+" Mbps";
  document.getElementById("s2").classList.add("hidden");

  // UPLOAD
  document.getElementById("up").innerText = (down*0.35).toFixed(2)+" Mbps";
  document.getElementById("s3").classList.add("hidden");

  document.getElementById("btn2").classList.remove("hidden");
  document.getElementById("btn3").classList.remove("hidden");
  document.getElementById("btn4").classList.remove("hidden");
}

// 5. DIRECT JPG DOWNLOAD
function downloadResult(){
  html2canvas(document.getElementById("resultCard"), {
    backgroundColor:'#1e1e00',
    scale:2 // HD quality
  }).then(canvas => {
    let link = document.createElement('a');
    link.download = 'SpeedTest_SP_'+Date.now()+'.jpg'; 
    link.href = canvas.toDataURL('image/jpeg', 0.95); // 95% quality JPG
    link.click();
  });
}
</script>
</body>
</html>
