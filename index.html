<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genuine Internet Speed Test Platform By SP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0A0F1E;display:flex;flex-direction:column;align-items:center;min-height:100vh;color:#fff}
.header{width:100%;background:#111827;padding:20px;text-align:center;border-bottom:2px solid #FF6B00}
.header h1{font-size:24px;font-weight:900;color:#FF6B00}
.container{width:95%;max-width:500px;background:#111827;margin:30px 0;border-radius:16px;padding:25px;border:1px solid #1F2937}
.gauge{width:100%;height:200px;position:relative;margin:10px 0}
.gauge svg{width:100%;height:100%}
.bg{fill:none;stroke:#1F2937;stroke-width:25;stroke-linecap:round}
.fill{fill:none;stroke:#FF6B00;stroke-width:25;stroke-linecap:round;stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset .1s linear}
.needle{stroke:#fff;stroke-width:4;stroke-linecap:round;transform-origin:250px 250px;transition:transform .1s linear}
.center{fill:#FF6B00}
.read{position:absolute;top:65%;left:50%;transform:translate(-50%,-50%);text-align:center}
.read .num{font-size:50px;font-weight:900;color:#fff}
.read .unit{font-size:14px;color:#9CA3AF}
.status{text-align:center;color:#FF6B00;font-weight:700;margin:15px 0;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#1F2937;border-radius:12px;padding:18px;text-align:center}
.stat .v{font-size:24px;font-weight:900}
.stat .l{font-size:12px;color:#9CA3AF;margin-top:3px}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;background:#FF6B00;color:#000;border:none;padding:15px;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer}
.btn.sec{background:#374151;color:#fff}
.btn:disabled{opacity:.4}
.info{margin-top:20px;background:#1F2937;border-radius:12px;padding:18px}
.info h3{color:#FF6B00;font-size:13px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:10px 0;font-size:13px;border-bottom:1px solid #374151}
.row:last-child{border:0}
.footer{width:100%;background:#111827;text-align:center;padding:20px;font-size:12px;color:#9CA3AF;margin-top:auto;border-top:2px solid #FF6B00}
.footer b{color:#fff}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center}
.pbox{background:#111827;border:1px solid #374151;border-radius:16px;width:90%;max-width:450px;padding:20px}
</style>
</head>
<body>

<div class="header"><h1>GENUINE INTERNET SPEED TEST PLATFORM BY SP</h1></div>

<div class="container">
  <div class="gauge">
    <svg viewBox="0 0 500 300">
      <path class="bg" d="M 50 250 A 200 200 0 0 1 450 250"/>
      <path class="fill" id="fill" d="M 50 250 A 200 200 0 0 1 450 250"/>
      <line id="needle" x1="250" y1="250" x2="250" y2="80" class="needle"/>
      <circle cx="250" cy="250" r="8" class="center"/>
    </svg>
    <div class="read"><div class="num" id="speed">0.00</div><div class="unit">Mbps</div></div>
  </div>

  <div class="status" id="status">Click START TEST</div>

  <div class="stats">
    <div class="stat"><div class="v" id="down">0.00</div><div class="l">DOWNLOAD</div></div>
    <div class="stat"><div class="v" id="up">0.00</div><div class="l">UPLOAD</div></div>
  </div>

  <div class="btns">
    <button class="btn" id="start">START TEST</button>
    <button class="btn sec" id="reset">RESET</button>
  </div>

  <div class="info">
    <h3>CONNECTION DETAILS</h3>
    <div class="row"><span>Device</span><span id="device">-</span></div>
    <div class="row"><span>Location</span><span id="loc">Click Allow</span></div>
    <div class="row"><span>IP Address</span><span id="ip">-</span></div>
    <div class="row"><span>ISP</span><span id="isp">-</span></div>
    <div class="row"><span>Network</span><span id="net">-</span></div>
  </div>
</div>

<div class="footer">
COPYRIGHT ©️ 2026 RESERVED<br>
<b>CREATED AND DEVELOPED BY PUNYA BINAY SWAIN</b>
</div>

<div class="popup" id="popup"><div class="pbox"><h2 style="text-align:center;color:#FF6B00">Test Complete</h2><div id="pdata"></div><button class="btn" style="margin-top:15px" onclick="popup.style.display='none'">Close</button></div></div>

<script>
let running=false;
start.onclick=startTest;
reset.onclick=()=>location.reload();

function updateGauge(val,max=1000){
  let p=Math.min(val/max,1);
  fill.style.strokeDashoffset=565-(565*p);
  needle.style.transform=`rotate(${(p*180)-90}deg)`;
  speed.innerText=val.toFixed(2);
}

async function startTest(){
  if(running)return; running=true; start.disabled=true;
  down.innerText=up.innerText='0.00'; updateGauge(0); status.innerText='Getting Info...';
  
  await getInfo();
  await getLocation();
  let ping=await pingTest();
  let d=await runTest('download');
  updateGauge(0,200);
  let u=await runTest('upload');
  
  status.innerText='Complete'; showPopup(d,u,ping);
  running=false; start.disabled=false;
}

async function runTest(type){
  status.innerText=`Testing ${type}...`;
  let bytes=0,startT=performance.now(),dur=20000;
  let iv=setInterval(()=>{let t=(performance.now()-startT)/1000;if(t>1){let s=(bytes*8)/1000000/t;document.getElementById(type==='download'?'down':'up').innerText=s.toFixed(2);updateGauge(s,type==='download'?500:100)}},100);
  let workers=Array(8).fill().map(async()=>{
    while(performance.now()-startT<dur){
      try{
        let url=`https://speed.cloudflare.com/__${type==='download'?'down?bytes=50000':'up'}&t=${Date.now()}`;
        let res=await fetch(url,{method:type==='download'?'GET':'POST',body:type==='upload'?new Blob([new Uint8Array(2*1024*1024)]):null});
        if(type==='download'){let r=res.body.getReader();while(true){let {done,value}=await r.read();if(done)break;bytes+=value.length}}else bytes+=2*1024*1024;
      }catch(e){}
    }
  });
  await Promise.all(workers); clearInterval(iv);
  return ((bytes*8)/1000000/((performance.now()-startT)/1000)).toFixed(2);
}

async function pingTest(){
  status.innerText='Testing Ping...';
  let t=performance.now(); await fetch('https://www.google.com/favicon.ico?t='+Date.now(),{mode:'no-cors'});
  return Math.round(performance.now()-t);
}

function getLocation(){
  return new Promise(r=>{
    if(!navigator.geolocation){loc.innerText='Not Supported';return r()}
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        let res=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&localityLanguage=en`);
        let d=await res.json();
        loc.innerText=`${d.city}, ${d.principalSubdivision} - ${d.postcode}`;
      }catch(e){loc.innerText='Failed'} r();
    },()=>{loc.innerText='Denied';r()},{enableHighAccuracy:true,timeout:10000});
  });
}

async function getInfo(){
  device.innerText=/Android|iPhone/.test(navigator.userAgent)?'Mobile':'Desktop';
  try{let r=await fetch('https://ipapi.co/json/');let d=await r.json();ip.innerText=d.ip;isp.innerText=d.org}catch(e){}
  let c=navigator.connection;
  if(c){
    if(c.type==='wifi')net.innerText='WiFi';
    else if(c.effectiveType==='5g')net.innerText='5G';
    else if(c.effectiveType==='4g')net.innerText='4G';
    else net.innerText=c.effectiveType;
  }else net.innerText='Broadband';
}

function showPopup(d,u,p){
  pdata.innerHTML=`<div class="row"><span>Download</span><span>${d} Mbps</span></div><div class="row"><span>Upload</span><span>${u} Mbps</span></div><div class="row"><span>Ping</span><span>${p} ms</span></div><div class="row"><span>Location</span><span>${loc.innerText}</span></div>`;
  popup.style.display='flex';
}
</script>
</body>
</html>
