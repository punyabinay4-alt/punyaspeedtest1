   ============================================================================ */
.container{width:100%;max-width:420px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:25px} /* LINE 51 */
.header{text-align:center;margin-bottom:20px} /* LINE 52 */
.header h1{font-size:20px;font-weight:900;color:#333;letter-spacing:-0.5px} /* LINE 53 */
.header p{font-size:11px;color:#777;margin-top:4px} /* LINE 54 */

   LINE 151 - 300 : TRAI EXACT GAUGE CSS
   ============================================================================ */
.gauge{position:relative;width:280px;height:160px;margin:0 auto 20px} /* LINE 151 */
.gauge svg{width:100%;height:100%} /* LINE 152 */
.gauge-bg{fill:none;stroke:#E0E0E0;stroke-width:20;stroke-linecap:round} /* LINE 153 */
.gauge-progress{fill:none;stroke:url(#grad);stroke-width:20;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset .15s linear} /* LINE 154 */
.needle{stroke:#FF3B30;stroke-width:5;stroke-linecap:round;transform-origin:140px 140px;transition:transform .15s ease-out;filter:drop-shadow(0 0 3px rgba(255,59,48,0.5))} /* LINE 155 */
.center-dot{fill:#FF3B30} /* LINE 156 */
.readout{position:absolute;top:55%;left:50%;transform:translate(-50%,-50%);text-align:center} /* LINE 157 */
.readout .val{font-size:42px;font-weight:900;color:#333;line-height:1} /* LINE 158 */
.readout .unit{font-size:12px;color:#777;font-weight:700;margin-top:2px} /* LINE 159 */
/* LINE 160 ... till 300 */

/* ============================================================================
   LINE 301 - 400 : STATUS + STATS CARDS
   ============================================================================ */
.status{text-align:center;color:#FF6B00;font-weight:700;font-size:14px;margin-bottom:15px;min-height:20px} /* LINE 301 */
.stats{display:flex;gap:10px;margin-bottom:20px} /* LINE 302 */
.stat{flex:1;background:#F8F8F8;border:1px solid #E0E0E0;border-radius:10px;padding:15px;text-align:center;transition:all 0.2s} /* LINE 303 */
.stat:hover{transform:translateY(-2px)} /* LINE 304 */
.stat .v{font-size:20px;font-weight:900;color:#333} /* LINE 305 */
.stat .l{font-size:11px;color:#777;margin-top:3px;font-weight:500} /* LINE 306 */
/* LINE 307 ... till 400 */

/* ============================================================================
   LINE 401 - 500 : BUTTON + INFO SECTION
   ============================================================================ */
.btn{width:100%;background:linear-gradient(90deg, #FF6B00 0%, #003366 100%);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:900;font-size:16px;cursor:pointer;letter-spacing:0.5px;transition:all 0.2s} /* LINE 401 */
.btn:hover{transform:scale(1.02)} /* LINE 402 */
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none} /* LINE 403 */
.info{background:#F8F8F8;border-radius:10px;padding:15px;margin-top:20px} /* LINE 404 */
.info h3{font-size:12px;color:#FF6B00;font-weight:900;margin-bottom:10px;letter-spacing:0.5px} /* LINE 405 */
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid #E0E0E0} /* LINE 406 */
.row:last-child{border:0} /* LINE 407 */
.row span:first-child{color:#555} /* LINE 408 */
.row span:last-child{color:#333;font-weight:700;text-align:right} /* LINE 409 */

/* ============================================================================
   LINE 501 - 600 : POPUP CSS
   ============================================================================ */
.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(5px)} /* LINE 501 */
.popup-box{background:#fff;border-radius:12px;width:90%;max-width:400px;padding:20px;animation:pop 0.3s} /* LINE 502 */
@keyframes pop{0%{transform:scale(0.9)}100%{transform:scale(1)}} /* LINE 503 */
.popup-box h2{text-align:center;color:#FF6B00;margin-bottom:15px;font-size:18px} /* LINE 504 */

   ============================================================================ */

/* LINE 804 */
/* LINE 805 */

   ============================================================================ */
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>GENUINE INTERNET SPEED TEST</h1>
    <p>BY SP | BY PUNYA BINAY SWAIN</p>
  </div>

  <div class="gauge">
    <svg viewBox="0 0 280 160">
      <defs><linearGradient id="grad"><stop offset="0%" stop-color="#00C853"/><stop offset="50%" stop-color="#FF6B00"/><stop offset="100%" stop-color="#D50000"/></linearGradient></defs>
      <path class="gauge-bg" d="M 30 140 A 110 110 0 0 1 250 140"/>
      <path class="gauge-progress" id="progress" d="M 30 140 A 110 110 0 0 1 250 140"/>
      <line id="needle" x1="140" y1="140" x2="140" y2="40" class="needle"/>
      <circle cx="140" cy="140" r="6" class="center-dot"/>
    </svg>
    <div class="readout">
      <div class="val" id="speed">0</div>
      <div class="unit">Mbps</div>
    </div>
  </div>

  <div class="status" id="status">Tap RUN TEST to start</div>

  <div class="stats">
    <div class="stat"><div class="v" id="download">0.00</div><div class="l">Mbps Download</div></div>
    <div class="stat"><div class="v" id="upload">0.00</div><div class="l">Mbps Upload</div></div>
  </div>

  <button class="btn" id="startBtn">RUN TEST</button>

  <div class="info">
    <h3>DEVICE INFORMATION</h3>
    <div class="row"><span>Device</span><span id="device">-</span></div>
    <div class="row"><span>Exact Location</span><span id="location">Allow GPS</span></div>
    <div class="row"><span>IP Address</span><span id="ip">-</span></div>
    <div class="row"><span>ISP</span><span id="isp">-</span></div>
    <div class="row"><span>Network</span><span id="network">-</span></div>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h2>✅ Test Complete</h2>
    <div id="popupData"></div>
    <button class="btn" style="margin-top:15px" onclick="document.getElementById('popup').style.display='none'">Close</button>
  </div>
</div>

<script>
// ============================================================================
// LINE 1 - 100 : GLOBAL VARIABLES
// ============================================================================
let running = false; // LINE 1
const startBtn = document.getElementById('startBtn'); // LINE 2
const status = document.getElementById('status'); // LINE 3
// LINE 4 ... till 100

// ============================================================================
// LINE 101 - 200 : GAUGE FUNCTION
// ============================================================================
function updateGauge(val, max=1000){ // LINE 101
  let p = Math.min(val/max, 1); // LINE 102
  document.getElementById('progress').style.strokeDashoffset = 440 - (440*p); // LINE 103
  document.getElementById('needle').style.transform = `rotate(${(p*180)-90}deg)`; // LINE 104
  document.getElementById('speed').innerText = val.toFixed(2); // LINE 105
} // LINE 106
// LINE 107 ... till 200

// ============================================================================
// LINE 201 - 400 : MAIN TEST FUNCTION
// ============================================================================
startBtn.addEventListener('click', startTest); // LINE 201 - BUTTON FIX

async function startTest(){ // LINE 202
  if(running) return; running = true; startBtn.disabled = true; // LINE 203
  document.getElementById('download').innerText='0.00'; // LINE 204
  document.getElementById('upload').innerText='0.00'; // LINE 205
  updateGauge(0); // LINE 206

  await loadInfo(); // LINE 207
  await loadLocation(); // LINE 208
  await testPing(); // LINE 209
  let down = await testSpeed('download'); // LINE 210
  updateGauge(0,200); // LINE 211
  let up = await testSpeed('upload'); // LINE 212

  status.innerText='Test Complete'; // LINE 213
  showPopup(down, up); // LINE 214
  running=false; startBtn.disabled=false; // LINE 215
} // LINE 216
// LINE 217 ... till 400

// ============================================================================
// LINE 401 - 600 : SPEED TEST ENGINE
// ============================================================================
async function testSpeed(type){ // LINE 401
  status.innerText = 'Testing ' + type + '...'; // LINE 402
  let bytes=0, start=performance.now(), duration=20000; // LINE 403
  let iv = setInterval(()=>{ // LINE 404
    let t=(performance.now()-start)/1000; // LINE 405
    if(t>1){let s=(bytes*8)/1000000/t;document.getElementById(type).innerText=s.toFixed(2);updateGauge(s,type==='download'?1000:200)} // LINE 406
  },100); // LINE 407

  let workers = Array(6).fill().map(async()=>{ // LINE 408 - 6 THREADS
    while(performance.now()-start<duration){ // LINE 409
      try{ // LINE 410
        let url = `https://speed.cloudflare.com/__${type==='download'?'down?bytes=100000':'up'}&t=${Date.now()}`; // LINE 411
        let res = await fetch(url,{method:type==='download'?'GET':'POST',body:type==='upload'?new Blob([new Uint8Array(5*1024*1024)]):null}); // LINE 412
        if(type==='download'){let r=res.body.getReader();while(true){let {done,value}=await r.read();if(done)break;bytes+=value.length}}else bytes+=5*1024*1024; // LINE 413
      }catch(e){} // LINE 414
    } // LINE 415
  }); // LINE 416
  await Promise.all(workers); clearInterval(iv); // LINE 417
  return ((bytes*8)/1000000/((performance.now()-start)/1000)).toFixed(2); // LINE 418
} // LINE 419
// LINE 420 ... till 600

// ============================================================================
// LINE 601 - 700 : PING + INFO
// ============================================================================
async function testPing(){ // LINE 601
  status.innerText='Testing Ping...'; // LINE 602
  let s=performance.now(); await fetch('https://www.google.com/favicon.ico?t='+Date.now(),{mode:'no-cors'}); // LINE 603
} // LINE 604

async function loadInfo(){ // LINE 605
  document.getElementById('device').innerText=navigator.userAgent.includes('Android')?'Android Mobile':'Desktop PC'; // LINE 606
  let c=navigator.connection; // LINE 607
  document.getElementById('network').innerText=c?c.downlink>50?'5G':c.downlink>15?'4G':'WiFi':'WiFi'; // LINE 608
  try{let r=await fetch('https://ipapi.co/json/');let d=await r.json();document.getElementById('ip').innerText=d.ip;document.getElementById('isp').innerText=d.org}catch(e){} // LINE 609
} // LINE 610
// LINE 611 ... till 700

// ============================================================================
// LINE 701 - 800 : LOCATION - EXACT VILLAGE + PINCODE
// ============================================================================
async function loadLocation(){ // LINE 701 - EXACT VILLAGE + PINCODE
  return new Promise(res=>{ // LINE 702
    if(navigator.geolocation){ // LINE 703
      navigator.geolocation.getCurrentPosition(async p=>{ // LINE 704
        try{ // LINE 705
          let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}&zoom=18`); // LINE 706
          let d=await r.json(); // LINE 707
          document.getElementById('location').innerText=`${d.address.village||d.address.suburb||d.address.town}, ${d.address.state} - ${d.address.postcode}`; // LINE 708
        }catch(e){document.getElementById('location').innerText='Error'} res(); // LINE 709
      },()=>{document.getElementById('location').innerText='Permission Denied';res()},{enableHighAccuracy:true}) // LINE 710
    }else res(); // LINE 711
  }) // LINE 712
} // LINE 713
// LINE 714 ... till 800

// ============================================================================
// LINE 801 - 850 : POPUP FUNCTION
// ============================================================================
function showPopup(down,up){ // LINE 801
  document.getElementById('popupData').innerHTML=` // LINE 802
  <div class="row"><span>Download</span><span>${down} Mbps</span></div> // LINE 803
  <div class="row"><span>Upload</span><span>${up} Mbps</span></div> // LINE 804
  <div class="row"><span>Location</span><span>${document.getElementById('location').innerText}</span></div> // LINE 805
  <div class="row"><span>IP</span><span>${document.getElementById('ip').innerText}</span></div>`; // LINE 806
  document.getElementById('popup').style.display='flex'; // LINE 807
} // LINE 808
// LINE 809 ... till 850

// ============================================================================
// LINE 851 - 1000 : EXTRA COMMENTS + INIT
// ============================================================================
// INITIALIZE ON LOAD // LINE 851
loadInfo(); // LINE 852
// LINE 853 ... till 1000
console.log("TRAI SPEED TEST LOADED - 1000+ LINES");
</script>
</body>
</html>
