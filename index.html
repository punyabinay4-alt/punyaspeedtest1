<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nam Punya Speed Test</title>
  <style>
    :root { --yellow: #FFD700; --black: #111; --dark: #1a1a1a; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: var(--black); color: white; text-align: center; padding: 20px; }
    header { padding: 20px 0; }
    header h1 { color: var(--yellow); font-size: 40px; font-weight: 900; letter-spacing: 2px; }
    header p { color: #aaa; margin-top: 5px; }
    .container { max-width: 600px; margin: 30px auto; background: var(--dark); padding: 40px 20px; border-radius: 15px; border: 2px solid var(--yellow); }
    .speed-box { display: flex; justify-content: space-around; flex-wrap: wrap; margin: 30px 0; }
    .card { background: #222; padding: 20px; border-radius: 10px; width: 170px; margin: 10px; border-bottom: 4px solid var(--yellow); }
    .card .label { color: #aaa; font-size: 14px; }
    .card .value { color: var(--yellow); font-size: 32px; font-weight: bold; margin: 10px 0; }
    button { background: var(--yellow); color: var(--black); border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #ffea00; transform: scale(1.05); }
    footer { margin-top: 40px; color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <header><h1>NAM PUNYA SPEED TEST</h1><p>Professional Internet Speed Checker</p></header>
  <div class="container">
    <div class="speed-box">
      <div class="card"><div class="label">PING</div><div class="value" id="ping">- ms</div></div>
      <div class="card"><div class="label">DOWNLOAD</div><div class="value" id="download">- Mbps</div></div>
      <div class="card"><div class="label">UPLOAD</div><div class="value" id="upload">- Mbps</div></div>
    </div>
    <button onclick="startTest()">START TEST</button>
  </div>
  <footer>© 2026 Nam Punya Speed Test. Powered by Ookla</footer>

  <script src="https://cdn.jsdelivr.net/npm/fast-speedtest-api@3.0.4/dist/index.min.js"></script>
  <script>
    let speedtest = new Speedtest();
    function startTest() {
      document.getElementById('ping').innerText = '...';
      document.getElementById('download').innerText = '...';
      document.getElementById('upload').innerText = '...';
      
      speedtest.getSpeed().then(s => {
        document.getElementById('download').innerText = s.toFixed(2) + ' Mbps';
        return speedtest.getUploadSpeed();
      }).then(u => {
        document.getElementById('upload').innerText = u.toFixed(2) + ' Mbps';
        return speedtest.getPing();
      }).then(p => {
        document.getElementById('ping').innerText = p.toFixed(0) + ' ms';
      }).catch(e => {
        alert('Error: ' + e);
      });
    }
  </script>
</body>
</html>
