<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genuine Internet Speed Test By SP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { background: #000; min-height: 100vh; padding: 15px; background-image: url('https://images.unsplash.com/photo-1587974928442-77dc0e8d2476?q=80&w=1920'); background-size: cover; background-attachment: fixed; }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,107,0,0.85) 0%, rgba(0,51,102,0.9) 100%); z-index: -1; }
.container { max-width: 650px; margin: 20px auto; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); padding: 30px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.header { text-align: center; margin-bottom: 25px; }
.title { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #ff6b00, #003366); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 12px; color: #003366; font-weight: 600; }

/* TRAI STYLE SPEEDOMETER */
.speedo { width: 320px; height: 180px; margin: 30px auto; position: relative; }
.speedo svg { width: 100%; height: 100%; }
.track { fill: none; stroke: #e0e0e0; stroke-width: 25; stroke-linecap: round; }
.progress { fill: none; stroke: url(#grad); stroke-width: 25; stroke-linecap: round; stroke-dasharray: 565; stroke-dashoffset: 565; transition: stroke-dashoffset 0.2s linear; }
.needle { stroke: #ff0000; stroke-width: 5; stroke-linecap: round; transform-origin: 160px 160px; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); filter: drop-shadow(0 0 5px red); }
.center { fill: #ff6b00; }
.read { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
.read .val { font-size: 52px; font-weight: 800; color: #003366; }
.read .unit { font-size: 14px; color: #555; font-weight: 700; }

.status { text-align: center; color: #ff6b00; font-weight: 700; margin: 15px 0; font-size: 15px; }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
.card { background: linear-gradient(135deg, rgba(255,107,0,0.1), rgba(0,51,102,0.05)); border: 2px solid rgba(255,107,0,0.2); border-radius: 14px; padding: 18px; text-align: center; }
.card .v { font-size: 24px; font-weight: 800; color: #003366; }
.card .l { font-size: 12px; color: #555; font-weight: 600; }
.btn { width: 100%; background: linear-gradient(135deg, #ff6b00, #003366); color: #fff; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; }
.btn:disabled { opacity: 0.5; }
.device { background: rgba(255,107,0,0.08); border-radius: 14px; padding: 18px; margin-top: 20px; }
.device h3 { color: #ff6b00; font-size: 15px; margin-bottom: 12px; font-weight: 800; }
.row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.1); font-size: 13px; }
.row span:last-child { color: #003366; font-weight: 700; }

.popup { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; }
.popup-box { background: #fff; border-radius: 20px; width: 90%; max-width: 470px; overflow: hidden; }
.popup-header { background: linear-gradient(135deg, #ff6b00, #003366); padding: 25px; text-align: center; color: #fff; }
.popup-body { padding: 20px; }
.popup .r { display: flex; justify-content: space-between; padding: 12px 0; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
.popup .r span { color: #ff6b00; font-weight: 700; }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
  <div class="header">
    <div class="title">GENUINE INTERNET SPEED TEST</div>
    <div class="subtitle">BY SP | BY PUNYA BINAY SWAIN</div>
  </div>

  <div class="speedo">
    <svg viewBox="0 0 320 180">
      <defs><linearGradient id="grad"><stop offset="0%" stop-color="#00ff88"/><stop offset="50%" stop-color="#ff6b00"/><stop offset="100%" stop-color="#ff0000"/></linearGradient></defs>
      <path class="track" d="M 20 160 A 140 140 0 0 1 300 160"/>
      <path class="progress" id="progress" d="M 20 160 A 140 140 0 0 1 300 160"/>
      <line id="needle" x1="160" y1="160" x2="160" y2="40" class="needle"/>
      <circle cx="160" cy="160" r="8" class="center"/>
    </svg>
    <div class="read"><div class="val" id="speed">0</div><div class="unit">Mbps</div></div>
  </div>

  <div class="status" id="status">Tap RUN TEST to start</div>

  <div class="results">
    <div class="card"><div class="v" id="download">0.00</div><div class="l">Mbps Download</div></div>
    <div class="card"><div class="v" id="upload">0.00</div><div class="l">Mbps Upload</div></div>
  </div>

  <button class="btn" id="startBtn" onclick="startTest()">RUN TEST</button>

  <div class="device">
    <h3>DEVICE INFORMATION</h3>
    <div class="row"><span>Device</span><span id="device">-</span></div>
    <div class="row"><span>Exact Location</span><span id="location">Allow GPS</span></div>
    <div class="row"><span>IP Address</span><span id="ip">-</span></div>
    <div class="row"><span>ISP</span><span id="isp">-</span></div>
    <div class="row"><span>Network</span><span id="network">-</span></div>
  </div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <div class="popup-header"><h2>✅ Speed Test Complete</h2><div>Thank you for visiting<br>"Jay Jagannath"<br>By Punya Binay Swain</div></div>
    <div class="popup-body" id="popupBody"></div>
    <div style="padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" onclick="startTest()">Test Again</button><button class="btn" style="background:#555" onclick="popup.style.display='none'">Close</button></div>
  </div>
</div>

<script>
let running=false; let result={};
const SERVERS = [
    'https://speedtest.tele2.net', // TRAI/Google use similar
    'https://proof.ovh.net',
    'https://speed.cloudflare.com'
];

function updateGauge(val,max=1000){
    let p=Math.min(val/max,1);
    document.getElementById('progress').style.strokeDashoffset=565-(565*p);
    document.getElementById('needle').style.transform=`rotate(${(p*180)-90}deg)`;
    document.getElementById('speed').innerText=val.toFixed(2);
}

async function startTest(){
    if(running)return; running=true; startBtn.disabled=true; popup.style.display='none';
    ['download','upload'].forEach(i=>document.getElementById(i).innerText='0.00');
    document.getElementById('ping').innerText='0'; updateGauge(0);
    
    await getInfo(); await getLocation();
    result.ping = await testPing();
    result.download = await testSpeed('download');
    updateGauge(0,200);
    result.upload = await testSpeed('upload');
    
    document.getElementById('status').innerText='Test Complete';
    showPopup(); running=false; startBtn.disabled=false;
}

async function testSpeed(type){
    status.innerText='Testing '+type+'...';
    let bytes=0,start=performance.now(),duration=25000; // 25 sec for accuracy
    let iv=setInterval(()=>{let t=(performance.now()-start)/1000;if(t>1){let s=(bytes*8)/1000000/t;document.getElementById(type).innerText=s.toFixed(2);updateGauge(s,type==='download'?1000:200)}},100);
    
    let workers=Array(8).fill().map(async()=>{ // 8 threads like Ookla
        while(performance.now()-start<duration){
            try{
                let url=`${SERVERS[Math.floor(Math.random()*SERVERS.length)]}/__${type==='download'?'down?bytes=100000':'up'}&t=${Date.now()}`;
                let res=await fetch(url,{method:type==='download'?'GET':'POST',body:type==='upload'?new Blob([new Uint8Array(10*1024*1024)]):null});
                if(type==='download'){let r=res.body.getReader();while(true){let {done,value}=await r.read();if(done)break;bytes+=value.length}}else bytes+=10*1024*1024;
            }catch(e){}
        }
    });
    await Promise.all(workers); clearInterval(iv);
    return ((bytes*8)/1000000/((performance.now()-start)/1000)).toFixed(2);
}

async function testPing(){
    status.innerText='Testing Ping...';
    let pings=[]; for(let i=0;i<5;i++){let s=performance.now();await fetch('https://www.google.com/generate_204?t='+Date.now(),{mode:'no-cors'});pings.push(performance.now()-s)}
    return Math.round(pings.reduce((a,b)=>a+b)/pings.length);
}

async function getLocation(){ // EXACT VILLAGE + PINCODE
    return new Promise(res=>{
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(async p=>{
                try{
                    let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}&zoom=18`);
                    let d=await r.json(); 
                    location.innerText=`${d.address.village||d.address.town}, ${d.address.district} - ${d.address.postcode}`;
                }catch(e){location.innerText='Location Error'} res();
            },()=>{location.innerText='Permission Denied';res()},{enableHighAccuracy:true,timeout:10000})
        }else res();
    })
}

async function getInfo(){
    device.innerText=navigator.userAgent.includes('Android')?'Android Mobile':'PC';
    let c=navigator.connection; 
    network.innerText=c?c.effectiveType==='5g'||c.downlink>50?'5G':c.effectiveType==='4g'?'4G':'WiFi':'WiFi';
    try{let r=await fetch('https://ipapi.co/json/');let d=await r.json();ip.innerText=d.ip;isp.innerText=d.org}catch(e){}
}

function showPopup(){
    popupBody.innerHTML=`
    <div class="r"><b>Download</b><span>${result.download} Mbps</span></div>
    <div class="r"><b>Upload</b><span>${result.upload} Mbps</span></div>
    <div class="r"><b>Ping</b><span>${result.ping} ms</span></div>
    <div class="r"><b>Location</b><span>${location.innerText}</span></div>
    <div class="r"><b>IP</b><span>${ip.innerText}</span></div>
    <div class="r"><b>ISP</b><span>${isp.innerText}</span></div>
    <div class="r"><b>Network</b><span>${network.innerText}</span></div>`;
    popup.style.display='flex';
}
</script>
</body>
</html>
