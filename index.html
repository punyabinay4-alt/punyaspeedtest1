<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA SPEED TEST PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --primary: #00AEEF; --dark: #0D1117; --card: #161B22; --text: #C9D1D9; --border: #30363D; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; }
    body { background: var(--dark); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(0,174,239,0.1), transparent 50%); }
    .app { width: 100%; max-width: 600px; background: rgba(22,27,34,0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 32px; padding: 40px; box-shadow: 0 0 100px rgba(0,174,239,0.1); }
    .header { text-align: center; margin-bottom: 40px; }
    .logo { font-size: 28px; font-weight: 800; color: #fff; }
    .logo span { color: var(--primary); }
    
    /* WORLD CLASS GAUGE */
    .gauge-container { position: relative; width: 100%; height: 220px; margin-bottom: 20px; }
    .gauge { width: 100%; height: 100%; }
    .gauge-bg { fill: none; stroke: #222; stroke-width: 24; stroke-linecap: round; }
    .gauge-progress { fill: none; stroke: url(#gaugeGradient); stroke-width: 24; stroke-linecap: round; stroke-dasharray: 700; stroke-dashoffset: 700; transition: stroke-dashoffset 0.2s linear; filter: drop-shadow(0 0 10px var(--primary)); }
    .gauge-ticks { stroke: #444; stroke-width: 2; }
    .gauge-needle { stroke: #fff; stroke-width: 4; stroke-linecap: round; transform-origin: 300px 220px; transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1); filter: drop-shadow(0 0 5px #fff); }
    .gauge-center { fill: var(--primary); }
    .gauge-readout { position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .gauge-value { font-size: 64px; font-weight: 800; color: #fff; line-height: 1; }
    .gauge-unit { font-size: 16px; color: #888; font-weight: 700; }

    .status-bar { text-align: center; font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 30px; height: 24px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; text-align: center; }
    .stat-card .val { font-size: 24px; font-weight: 800; color: #fff; }
    .stat-card .label { font-size: 12px; color: #888; font-weight: 600; margin-top: 4px; }

    .btn-primary { width: 100%; background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 16px; font-weight: 800; font-size: 18px; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,174,239,0.4); }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

    .details { margin-top: 30px; padding-top: 30px; border-top: 1px solid var(--border); }
    .details h3 { font-size: 14px; color: #888; margin-bottom: 15px; font-weight: 700; }
    .detail-row { display: flex; justify-content: space-between; padding: 12px 0; font-size: 14px; }
    .detail-row span:last-child { color: #fff; font-weight: 600; text-align: right; }
    .network-tag { background: var(--primary); color: #000; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; }
</style>
</head>
<body>
<div class="app">
  <div class="header"><div class="logo">ULTRA <span>SPEED</span> PRO</div></div>

  <div class="gauge-container">
    <svg class="gauge" viewBox="0 0 600 250">
      <defs>
        <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00FF88"/><stop offset="50%" stop-color="#00AEEF"/><stop offset="100%" stop-color="#FF3B30"/>
        </linearGradient>
      </defs>
      <path class="gauge-bg" d="M 50 220 A 250 250 0 0 1 550 220"/>
      <path class="gauge-progress" id="gaugeProgress" d="M 50 220 A 250 250 0 0 1 550 220"/>
      <line x1="50" y1="220" x2="50" y2="205" class="gauge-ticks"/><text x="40" y="200" fill="#888" font-size="12">0</text>
      <line x1="300" y1="20" x2="300" y2="35" class="gauge-ticks"/><text x="285" y="15" fill="#888" font-size="12">500</text>
      <line x1="550" y1="220" x2="550" y2="205" class="gauge-ticks"/><text x="530" y="200" fill="#888" font-size="12">1000</text>
      <line id="needle" x1="300" y1="220" x2="300" y2="50" class="gauge-needle"/>
      <circle cx="300" cy="220" r="12" class="gauge-center"/>
    </svg>
    <div class="gauge-readout">
      <div class="gauge-value" id="speedValue">0.00</div>
      <div class="gauge-unit" id="speedUnit">Mbps</div>
    </div>
  </div>

  <div class="status-bar" id="status">Ready to Test</div>

  <div class="stats">
    <div class="stat-card"><div class="val" id="download">0.00</div><div class="label">DOWNLOAD</div></div>
    <div class="stat-card"><div class="val" id="upload">0.00</div><div class="label">UPLOAD</div></div>
    <div class="stat-card"><div class="val" id="ping">0</div><div class="label">PING ms</div></div>
  </div>

  <button class="btn-primary" id="startBtn" onclick="startFullTest()">START TEST</button>

  <div class="details">
    <h3>CONNECTION DETAILS</h3>
    <div class="detail-row"><span>Device</span><span id="device">-</span></div>
    <div class="detail-row"><span>Exact Location</span><span id="location">Waiting for GPS...</span></div>
    <div class="detail-row"><span>IP Address</span><span id="ip">-</span></div>
    <div class="detail-row"><span>ISP</span><span id="isp">-</span></div>
    <div class="detail-row"><span>Network Type</span><span id="network">-</span></div>
  </div>
</div>

<script>
let isRunning = false;
const servers = [
    'https://speed.cloudflare.com',
    'https://speedtest.tele2.net',
    'https://proof.ovh.net'
];

// 1. WORLD CLASS SPEEDOMETER
function updateGauge(speed, max=1000) {
    const circumference = 700;
    const percent = Math.min(speed / max, 1);
    const offset = circumference - (circumference * percent);
    document.getElementById('gaugeProgress').style.strokeDashoffset = offset;
    const rotation = (percent * 180) - 90;
    document.getElementById('needle').style.transform = `rotate(${rotation}deg)`;
    document.getElementById('speedValue').innerText = speed.toFixed(2);
}

// 2. ACCURATE MULTI-THREADED TEST
async function runSpeedTest(type) {
    document.getElementById('status').innerText = `Testing ${type}...`;
    let totalBytes = 0;
    let startTime = performance.now();
    const testDuration = 30000; // 30 SECONDS FOR ACCURACY

    const updateInterval = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        if (elapsed > 1) {
            const speed = (totalBytes * 8) / 1000000 / elapsed;
            document.getElementById(type).innerText = speed.toFixed(2);
            updateGauge(speed, type === 'download' ? 1000 : 200);
        }
    }, 100);

    const workers = Array(8).fill(null).map(() => async () => { // 8 CONNECTIONS
        while (performance.now() - startTime < testDuration) {
            try {
                const url = type === 'download' 
                    ? `${servers[Math.floor(Math.random()*servers.length)]}/__down?bytes=100000&t=${Date.now()}`
                    : `${servers[Math.floor(Math.random()*servers.length)]}/__up?t=${Date.now()}`;
                
                const res = await fetch(url, { method: type === 'download' ? 'GET' : 'POST', body: type === 'upload' ? new Blob([new Uint8Array(10*1024*1024)]) : null });
                if (type === 'download') {
                    const reader = res.body.getReader();
                    while(true) { const {done, value} = await reader.read(); if(done) break; totalBytes += value.length; }
                } else { totalBytes += 10*1024*1024; }
            } catch(e) {}
        }
    });
    await Promise.all(workers.map(w => w()));
    clearInterval(updateInterval);
    return ((totalBytes * 8) / 1000000 / ((performance.now() - startTime)/1000)).toFixed(2);
}

// 3. EXACT VILLAGE LOCATION
async function getExactLocation() {
    return new Promise(resolve => {
        if (!navigator.geolocation) return resolve();
        navigator.geolocation.getCurrentPosition(async pos => {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&zoom=18&addressdetails=1`);
                const data = await res.json();
                const a = data.address;
                const loc = `${a.village || a.town || a.suburb}, ${a.district}, ${a.state} - ${a.postcode}`;
                document.getElementById('location').innerText = loc;
            } catch(e) { document.getElementById('location').innerText = 'Location Error'; }
            resolve();
        }, () => { document.getElementById('location').innerText = 'Permission Denied'; resolve(); }, {enableHighAccuracy: true, timeout: 15000});
    });
}

// 4. CORRECT NETWORK DETECTION
function detectNetwork() {
    let net = 'Unknown';
    if (navigator.connection) {
        const c = navigator.connection;
        if (c.type === 'wifi') net = 'WiFi';
        else if (c.effectiveType === '5g' || c.downlink > 50) net = '5G';
        else if (c.effectiveType === '4g') net = '4G LTE';
        else if (c.effectiveType === '3g') net = '3G';
        net += ` <span class="network-tag">${c.downlink} Mbps</span>`;
    }
    document.getElementById('network').innerHTML = net;
}

async function startFullTest() {
    if (isRunning) return;
    isRunning = true;
    document.getElementById('startBtn').disabled = true;
    
    // Reset
    ['download','upload'].forEach(id => document.getElementById(id).innerText = '0.00');
    document.getElementById('ping').innerText = '0';
    updateGauge(0);

    await getExactLocation();
    detectNetwork();

    // Ping Test
    document.getElementById('status').innerText = 'Testing Ping...';
    let pings = [];
    for(let i=0; i<5; i++) { let s=performance.now(); await fetch('https://www.google.com/favicon.ico?t='+Date.now(), {mode:'no-cors'}); pings.push(performance.now()-s); }
    const avgPing = (pings.reduce((a,b)=>a+b)/pings.length).toFixed(0);
    document.getElementById('ping').innerText = avgPing;

    // Speed Tests
    const down = await runSpeedTest('download');
    updateGauge(0, 200); // reset for upload
    const up = await runSpeedTest('upload');
    
    document.getElementById('status').innerText = 'Test Complete';
    document.getElementById('startBtn').disabled = false;
    isRunning = false;
}

// Load device info
(async () => {
    document.getElementById('device').innerText = navigator.userAgent.includes('Android') ? 'Android Mobile' : 'Desktop PC';
    try { const res = await fetch('https://ipapi.co/json/'); const data = await res.json(); document.getElementById('ip').innerText = data.ip; document.getElementById('isp').innerText = data.org; } catch(e){}
})();
</script>
</body>
</html>
