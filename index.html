<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEED TEST X PRO BY SP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--neon:#00f5ff;--neon2:#0088ff;--bg:#000814}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif}
body{background:var(--bg);color:var(--neon);text-align:center;overflow-x:hidden;min-height:100vh}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 50% 30%, #003d66 0%, #000814 70%)}
#grid{position:fixed;top:0;left:0;width:200%;height:200%;background-image:linear-gradient(rgba(0,245,255,0.1) 1px, transparent 1px),linear-gradient(90deg, rgba(0,245,255,0.1) 1px, transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite;z-index:-1}
@keyframes gridMove{0%{transform:translate(0,0)}100%{transform:translate(-50px,-50px)}}
.container { max-width:550px; margin:0 auto; padding:15px; padding-top:30px; }
.logo { font-family:'Orbitron', sans-serif; font-size:26px; color:var(--neon); text-shadow:0 0 20px var(--neon); margin-bottom:3px; }
.creator { font-size:11px; color:#66ddff; margin-bottom:20px; }
.card { background: rgba(0,20,40,0.85); backdrop-filter:blur(30px); border:2px solid var(--neon); padding:25px; border-radius:25px; margin:20px 0; text-align:left; box-shadow:0 0 50px rgba(0,245,255,0.5); }
.row { display:flex; align-items:center; justify-content:space-between; padding:13px 0; }
.label { display:flex; align-items:center; gap:10px; font-weight:600; color:#88ddff; font-size:14px; }
.value { font-weight:800; color:#fff; font-size:15px; }
svg.icon { width:20px; height:20px; fill:var(--neon); filter:drop-shadow(0 0 8px var(--neon)); }
hr { margin:12px 0; border:none; border-top:1px solid rgba(0,245,255,0.3); }
.meter { height:10px; background:rgba(0,245,255,0.1); border-radius:10px; overflow:hidden; margin-top:5px; }
.meter-bar { height:100%; width:0%; background:linear-gradient(90deg, var(--neon2), var(--neon)); box-shadow:0 0 15px var(--neon); transition:width 0.3s; }
.spin { width:20px; height:20px; border:3px solid rgba(0,245,255,0.3); border-top:3px solid var(--neon); border-radius:50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); }
.hidden { display:none !important; }
.btn { background:linear-gradient(90deg, var(--neon2), var(--neon)); color:#000; border:none; padding:17px; font-size:15px; font-weight:800; border-radius:14px; cursor:pointer; margin:8px 0; width:100%; transition:0.3s; box-shadow:0 0 25px rgba(0,245,255,0.6); }
.btn:hover { transform:scale(1.03); }
.location-btn { background:linear-gradient(90deg, #ff7700, #ffaa00); }
.badge { background:rgba(0,245,255,0.2); padding:3px 10px; border-radius:15px; font-size:10px; border:1px solid var(--neon); }
footer { margin-top:25px; font-size:12px; color:#66ddff; font-weight:700; line-height:1.6; }
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div>

<div class="container">
  <div class="logo">⚡ SPEED TEST X PRO BY SP</div>
  <div class="creator">CREATED AND DEVELOPED BY PUNYA BINAY SWAIN</div>

  <div class="card" id="resultCard">
    <button class="btn location-btn" onclick="getLocation()">📍 GET PRECISE LOCATION</button>
    <div class="row"><div class="label">📍 GPS Location</div> <div class="value" id="gpsLocation">Tap Button</div></div>
    <div class="row"><div class="label">🏷️ IP Address</div> <div class="value" id="ipAddress">Loading...</div></div>
    <div class="row"><div class="label">📶 Network</div> <div class="value"><span id="network">--</span> <span class="badge" id="badge">--</span></div></div>
    <div class="row"><div class="label">🖥️ Server</div> <div class="value" id="server">Cloudflare India</div></div>
    <hr>
    <div class="row"><div class="label">📈 Ping</div> <div class="value"><span id="ping">0 ms</span> <span id="s1" class="spin hidden"></span></div></div>
    <div class="meter"><div id="p1" class="meter-bar"></div></div>
    <div class="row"><div class="label">⬇️ Download</div> <div class="value"><span id="down">0 Mbps</span> <span id="s2" class="spin hidden"></span></div></div>
    <div class="meter"><div id="p2" class="meter-bar"></div></div>
    <div class="row"><div class="label">⬆️ Upload</div> <div class="value"><span id="up">0 Mbps</span> <span id="s3" class="spin hidden"></span></div></div>
    <div class="meter"><div id="p3" class="meter-bar"></div></div>
  </div>

  <button class="btn" id="btn1" onclick="start()">START TEST</button>
  <button class="btn hidden" id="btn2" onclick="start()">TEST AGAIN</button>
  <button class="btn hidden" id="btn4" onclick="downloadResult()">DOWNLOAD REPORT</button>
  <button class="btn hidden" id="btn5" onclick="location.reload()">REFRESH</button>

  <footer>© 2026<br>CREATED AND DEVELOPED BY PUNYA BINAY SWAIN<br>GENUINE SPEEDTEST PLATFORM</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
async function getLocation(){
  document.getElementById("gpsLocation").innerText = "Getting GPS...";
  try{
    let ipData = await fetch('https://ipapi.co/json/').then(r=>r.json());
    document.getElementById("ipAddress").innerText = ipData.ip;
  }catch{}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async function(p){
      let gps = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+p.coords.latitude+"&longitude="+p.coords.longitude).then(r=>r.json());
      document.getElementById("gpsLocation").innerText = (gps.locality||gps.city)+", "+gps.principalSubdivision;
    },()=>{ document.getElementById("gpsLocation").innerText = "Permission Denied"; })
  }
}

function detectNetwork(){
  const c = navigator.connection;
  let net = "Unknown", badge = "--";
  if(c){
    if(c.type === 'wifi') {net = "WiFi"; badge = "WiFi";}
    else if(c.effectiveType === '4g' || c.downlink > 8) {net = "4G LTE"; badge = "4G";}
    else if(c.effectiveType === '5g') {net = "5G"; badge = "5G";}
    else if(c.effectiveType === '3g') {net = "3G"; badge = "3G";}
  }
  document.getElementById("network").innerText = net;
  document.getElementById("badge").innerText = badge;
}

async function start(){
  document.getElementById("btn1").disabled = true;
  showSpinner(true); detectNetwork(); resetMeter();
  
  try {
    // FAST PING TO GOOGLE DNS INDIA
    let t1 = Date.now();
    await fetch('https://8.8.8.8/generate_204?r='+Math.random(), {mode:'no-cors'});
    let ping = Date.now() - t1;
    document.getElementById("ping").innerText = ping+" ms";
    document.getElementById("p1").style.width = Math.min(100, 200/ping*100)+"%";
    showSpinner(false,1);

    // DOWNLOAD
    let totalBytes = 0; let startTime = Date.now();
    let [res1, res2] = await Promise.all([
      fetch('https://speed.cloudflare.com/__down?bytes=1000000&r=1'),
      fetch('https://speed.cloudflare.com/__down?bytes=1000000&r=2')
    ]);
    let [b1, b2] = await Promise.all([res1.blob(), res2.blob()]);
    totalBytes = b1.size + b2.size;
    let down = ((totalBytes*8)/((Date.now() - startTime)/1000))/1000000;
    document.getElementById("down").innerText = down.toFixed(2)+" Mbps";
    document.getElementById("p2").style.width = Math.min(100, down/100*100)+"%";
    showSpinner(false,2);

    // UPLOAD
    let upData = new Blob([new Uint8Array(500*1024)]);
    startTime = Date.now();
    await fetch('https://speed.cloudflare.com/__up', {method:'POST', body:upData});
    let up = ((upData.size*8)/((Date.now() - startTime)/1000))/1000000;
    document.getElementById("up").innerText = up.toFixed(2)+" Mbps";
    document.getElementById("p3").style.width = Math.min(100, up/50*100)+"%";
    showSpinner(false,3);

  } catch(e) {}

  document.getElementById("btn1").disabled = false;
  document.getElementById("btn2").classList.remove("hidden");
  document.getElementById("btn4").classList.remove("hidden");
  document.getElementById("btn5").classList.remove("hidden");
}

function showSpinner(s,n){if(n)document.getElementById("s"+n).classList.toggle("hidden",!s)}
function resetMeter(){["p1","p2","p3"].forEach(id=>document.getElementById(id).style.width="0%")}
function downloadResult(){
  html2canvas(document.getElementById("resultCard"), {backgroundColor:'#001428', scale:2}).then(c => {
    let a = document.createElement('a');
    a.download = 'SpeedTestXPro_BySP.jpg'; a.href = c.toDataURL('image/jpeg', 0.95); a.click();
  });
}
window.onload = getLocation;
</script>
</body>
</html>
